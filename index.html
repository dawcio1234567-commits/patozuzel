<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PATO-ŻUŻEL :: SYMULATOR KARIERY</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');
*{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
body{background:#050505;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0px,rgba(255,255,255,.018) 1px,transparent 1px,transparent 3px)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#2a2a2a;border:1px solid #000}
::-webkit-scrollbar-thumb:hover{background:#c2410c}
.brut{border:1px solid #71717a;background:#0e0e0e}
.brut-h{border-bottom:1px solid #71717a;background:#1c1c1f;letter-spacing:.12em}
.btn{border:1px solid #71717a;background:#1c1c1f;color:#f4f4f5;transition:none}
.btn:hover{background:#f97316;border-color:#fdba74;color:#000}
.btn:active{transform:translate(1px,1px)}
.btn-d{border:1px solid #dc2626;background:#2a0d0d;color:#fecaca}
.btn-d:hover{background:#ef4444;border-color:#fca5a5;color:#000}
.glow{text-shadow:0 0 12px rgba(249,115,22,.55)}
.blink{animation:bl 1.1s steps(2,start) infinite}
@keyframes bl{to{visibility:hidden}}
.bar{height:9px;background:#27272a;border:1px solid #71717a;position:relative;overflow:hidden}
.bar>i{display:block;height:100%;background:#f97316}
table{border-collapse:collapse}
td,th{padding:3px 7px}
.rowhl{background:rgba(249,115,22,.20);outline:1px solid rgba(251,146,60,.85)}
select,input{background:#131316;border:1px solid #71717a;color:#f4f4f5;padding:6px 9px;outline:none}
select:focus,input:focus{border-color:#fb923c;box-shadow:0 0 0 2px rgba(251,146,60,.35)}
.fade{animation:fi .18s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- PAMIĄTKOWA KARTA "SportoweMity.pl" ----
   Kontener stoi poza ekranem (nie display:none — html2canvas musi go wyrenderować).
   Własna typografia: karta ma wyglądać jak portal, a nie jak terminal. */
#smCardWrap{position:fixed;left:-14000px;top:0;z-index:-1;pointer-events:none;opacity:1}
#smCard,#smCard *{font-family:Arial,Helvetica,'Segoe UI',sans-serif !important;box-sizing:border-box}
#smCard table{border-collapse:collapse}
#smCard td,#smCard th{padding:0}
</style>
</head>
<body class="text-zinc-200 text-[13px] leading-snug">
<div id="app" class="max-w-6xl mx-auto p-3 sm:p-5"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
/* ============================================================
   PATO-ŻUŻEL :: SYMULATOR KARIERY POLSKIEGO ŻUŻLOWCA
   Logika interfejsu (UI): ekrany, renderowanie HTML, obsługa
   interakcji. Wymaga wcześniejszego wczytania data.js i engine.js.
   ============================================================ */

/* ---- KATEGORIE WIEKOWE (jedno źródło prawdy dla całego UI) ----
   Silnik zna tylko twardy warunek: junior = U21. Powyżej 21 lat nikt nie jest
   już "juniorem" — jest U24 (do 24. roku życia włącznie) albo seniorem. */
/* "1 rok", "2 lata", "5 lat" — pojawia się przy każdej ofercie kontraktu. */
const lataTxt = n => n===1 ? 'rok'
  : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20)) ? 'lata' : 'lat';

const catOf    = r => isJun(r) ? 'JUNIOR (U21)' : isU24(r) ? 'U24' : 'SENIOR';
const catShort = r => isJun(r) ? 'U21' : isU24(r) ? 'U24' : 'SENIOR';
const catCol   = r => isJun(r) ? 'text-pink-400' : isU24(r) ? 'text-sky-400' : 'text-zinc-300';

function codesHtml(codes){
 return codes.map(c=> c==='d'?'<span class="text-red-500">d</span>'
   : c==='w'?'<span class="text-red-400">w</span>'
   : c==='-'?'<span class="text-zinc-400">-</span>'
   : c.endsWith('*')?'<span class="text-sky-400">'+c+'</span>' : c).join(',');
}

/* ============================================================
   7. RENDER
   ============================================================ */
const app=()=>document.getElementById('app');
function render(){
 const s=G.screen;
 app().innerHTML =
   s==='create'  ? scCreate() :
   s==='sign'    ? scSign()   :
   s==='hub'     ? scHub()    :
   s==='event'   ? scEvent()  :
   s==='summary' ? scSummary():
   s==='end'     ? scEnd()    : '';
 window.scrollTo({top:0});
}

function head(){
 return `<div class="mb-4 border-b border-zinc-700 pb-2 flex items-end justify-between flex-wrap gap-2">
  <div><div class="text-orange-500 font-extrabold tracking-[.3em] text-lg glow">PATO-ŻUŻEL</div>
  <div class="text-[11px] text-zinc-400 tracking-[.25em]">SYMULATOR KARIERY // ROK ${G.year}</div></div>
  <div class="text-[11px] text-zinc-400 text-right">jedno kliknięcie = jeden sezon</div></div>`;
}
function statBar(l,v,col='#f97316'){
 return `<div class="mb-1.5"><div class="flex justify-between text-[11px] text-zinc-300 tracking-wider"><span>${l}</span><span class="text-zinc-200">${v}</span></div>
 <div class="bar"><i style="width:${cl(v,0,99)}%;background:${col}"></i></div></div>`;
}

/* ---- EKRAN: TWORZENIE ---- */
function scCreate(){
 return head()+`<div class="fade">
 <div class="brut mb-4"><div class="brut-h px-3 py-1.5 text-[11px] text-orange-500 font-bold">TWORZENIE ZAWODNIKA // WIEK STARTOWY: 16 LAT</div>
 <div class="p-4 space-y-4">
   <div><label class="block text-[11px] text-zinc-300 tracking-widest mb-1">IMIĘ I NAZWISKO</label>
   <input id="pname" maxlength="28" value="Mariusz Kowalczyk" class="w-full sm:w-96"></div>
   <div><label class="block text-[11px] text-zinc-300 tracking-widest mb-2">KLASA POSTACI</label>
   <div class="grid sm:grid-cols-2 gap-2">
   ${CLASSES.map(c=>`<label class="brut p-3 cursor-pointer hover:border-orange-600 block">
     <div class="flex items-start gap-2"><input type="radio" name="cls" value="${c.id}" ${c.id==='bez'?'checked':''} class="mt-1 accent-orange-500">
     <div><div class="font-bold text-zinc-100">${c.n}</div>
     <div class="text-[11px] text-orange-600 tracking-widest">OVR ${c.ovr[0]}–${c.ovr[1]}</div>
     <div class="text-[11px] text-zinc-300 mt-1">${c.d}</div></div></div></label>`).join('')}
   </div></div>
   <div class="text-[11px] text-zinc-400 border-l-2 border-zinc-700 pl-3">
   Startujesz na kontrakcie <b class="text-zinc-300">amatorskim</b>: darmowy sprzęt klubowy, grosze za punkty, zero kasy za podpis.<br>
   Budżet: 0 zł &nbsp;·&nbsp; Sprzęt: 20 &nbsp;·&nbsp; Profesjonalizm i Medialność: ukryte, zależne od klasy.</div>
   <button onclick="doCreate()" class="btn px-6 py-2.5 font-bold tracking-widest text-orange-500">ZACZYNAM KARIERĘ &gt;</button>
 </div></div></div>`;
}
function doCreate(){
 const n=document.getElementById('pname').value.trim()||'Bezimienny Grajek';
 const c=document.querySelector('input[name=cls]:checked').value;
 G.p=newPlayer(n,c);
 genAllSquads();
 const meR=makeRider(G.p.age, G.p.ovr); meR.me=true; meR.name=G.p.name; G.riders.push(meR);
 G.screen='sign'; render();
}

/* ---- EKRAN: PODPISANIE KONTRAKTU ---- */
let _offers=[];
function scSign(){
 const p=G.p;
 if(!_offers.length) _offers = (p.club===null) ? firstOffers() : makeOffers();
 const offers=_offers;
 if(!offers.length){
   const idle=p.idleYears||0;
   return head()+`<div class="brut border-red-900 fade">
   <div class="brut-h px-3 py-1.5 text-[11px] text-red-500 font-bold" style="border-color:#7f1d1d">RYNEK TRANSFEROWY ${G.year} // BRAK OFERT</div>
   <div class="p-5">
   <div class="text-zinc-300 mb-3">Żaden klub w Polsce nie chce cię widzieć na torze. Telefon milczy.</div>
   <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
     ${kpi('WIEK',p.age)}${kpi('OVR',p.ovr)}${kpi('LATA BEZ KLUBU',idle,idle>=2?'text-red-500':'text-zinc-100')}${kpi('BUDŻET',zl(p.budget),'text-orange-400')}
   </div>
   ${p.idleLog&&p.idleLog.length?`<div class="brut p-3 mb-4"><div class="text-[11px] text-zinc-400 tracking-widest mb-1">CO SIĘ DZIAŁO</div>
     <ul class="text-[11px] text-zinc-300 space-y-0.5">${p.idleLog.map(l=>'<li>› '+esc(l)+'</li>').join('')}</ul></div>`:''}
   <div class="text-[11px] text-zinc-400 mb-4">Możesz czekać na telefon i trenować na własną rękę — ale każdy rok bez ścigania zjada twój OVR.
   ${idle>=2?'<b class="text-red-500 blink">Po trzecim roku bez klubu kariera kończy się sama.</b>':''}</div>
   <div class="flex gap-2 flex-wrap">
     <button onclick="skipYear()" class="btn px-5 py-2.5 font-bold tracking-widest text-orange-500">PRZECZEKAJ ROK ${G.year} &gt;</button>
     <button onclick="retire('Nikt już nie dzwonił.')" class="btn-d px-5 py-2.5 font-bold tracking-widest text-red-400">ZAKOŃCZ KARIERĘ</button>
   </div></div></div>`;
 }
 return head()+`<div class="fade">
 ${playerStrip()}
 <div class="brut"><div class="brut-h px-3 py-1.5 text-[11px] text-orange-500 font-bold">OKIENKO TRANSFEROWE // OFERTY NA SEZON ${G.year}</div>
 <div class="p-3 grid md:grid-cols-2 gap-2">
 ${offers.map((o,i)=>`<div class="brut p-3 ${o.stay?'border-orange-800':''}">
   <div class="flex justify-between items-start gap-2">
     <div><div class="font-bold text-zinc-100 text-[12px]">${esc(o.club)}</div>
     <div class="text-[11px] text-zinc-400 tracking-widest">${G.leagues[o.lk].short} · OVR ${o.ovr} · budżet ${zl(o.budget)}</div></div>
     ${o.stay?'<span class="text-[11px] text-orange-500 border border-orange-800 px-1.5 py-0.5">PRZEDŁUŻENIE</span>':''}
   </div>
   <div class="mt-2 border border-zinc-700 bg-[rgba(249,115,22,.07)] px-2 py-1.5">
     <span class="text-[11px] text-zinc-300 tracking-widest">DŁUGOŚĆ UMOWY</span>
     <span class="text-[13px] font-extrabold text-orange-400 ml-2">${o.years} ${lataTxt(o.years)}</span>
     <span class="text-[11px] text-zinc-400 ml-1">(do końca sezonu ${G.year+o.years-1}${o.years>1?' — przez ten czas nie ma okienka transferowego':''})</span>
   </div>
   <div class="mt-2 grid grid-cols-3 gap-2 text-[11px]">
     <div><div class="text-zinc-400">KONTRAKT</div><div class="${o.type==='Zawodowy'?'text-emerald-400':'text-zinc-300'}">${o.type}</div></div>
     <div><div class="text-zinc-400">ZA PUNKT</div><div class="text-zinc-100">${zl(o.rate)}</div></div>
     <div><div class="text-zinc-400">ZA PODPIS</div><div class="text-zinc-100">${o.bonus?zl(o.bonus):'—'}</div></div>
   </div>
   <div class="mt-2">
     <div class="flex justify-between text-[11px]"><span class="text-zinc-400">SZANSA NA JAZDĘ W SKŁADZIE</span>
     <span class="${o.ride>=70?'text-emerald-400':o.ride>=40?'text-yellow-500':'text-red-500'} font-bold">${o.ride}%</span></div>
     <div class="bar"><i style="width:${o.ride}%;background:${o.ride>=70?'#34d399':o.ride>=40?'#eab308':'#ef4444'}"></i></div>
     <div class="text-[11px] text-zinc-400 mt-0.5">${o.ride>=70?'pierwszy skład':o.ride>=40?'rotacja / rezerwa':'będziesz oglądał z parkingu'}</div>
   </div>
   ${o.debt>0?`<div class="text-[11px] text-red-500 mt-1">UWAGA: klub ma zaległości ${zl(o.debt)} — kadra takiego klubu jeździ wyraźnie słabiej</div>`:''}
   <button onclick="pickOffer(${i})" class="btn w-full mt-2 py-1.5 text-[11px] font-bold tracking-widest">PODPISUJĘ NA ${o.years} ${lataTxt(o.years).toUpperCase()}</button>
 </div>`).join('')}
 </div></div></div>`;
}
function firstOffers(){
 const p=G.p, out=[], used=new Set();
 // Trzy różne ścieżki: prestiż (będziesz grzał ławkę), środek, albo klub,
 // w którym od razu wskoczysz do składu. Wybór należy do ciebie.
 const targets=[p.ovr+32+R(-4,4), p.ovr+17+R(-4,4), p.ovr+5+R(-4,4)];
 targets.forEach(t=>{
   const target=cl(t,30,97);
   const pool=[];
   LKEYS.forEach(lk=>G.leagues[lk].clubs.forEach(c=>{
     if(used.has(c.name)) return;
     pool.push({c,lk,diff:Math.abs(c.ovr-target)});
   }));
   pool.sort((a,b)=>a.diff-b.diff);
   const best=pool[0]; if(!best) return;
   used.add(best.c.name);
   out.push({club:best.c.name, lk:best.lk, ovr:best.c.ovr, budget:best.c.budget, debt:best.c.debt,
     type:'Amatorski', years:R(1,2), rate:R(150,400), bonus:0, stay:false,
     ride:appearanceChance(p,best.c,55,null)});
 });
 return out.sort((a,b)=>b.ovr-a.ovr);
}
function pickOffer(i){ const o=_offers[i]; _offers=[]; signContract(o); }

/* ---- PASEK ZAWODNIKA ---- */
function playerStrip(){
 const p=G.p, club=p.club?getClub(p):null;
 return `<div class="brut mb-3">
 <div class="brut-h px-3 py-1.5 flex justify-between items-center flex-wrap gap-1">
  <div class="text-[12px] font-bold text-zinc-100">${esc(p.name)} <span class="text-zinc-400 font-normal">· ${p.age} lat · ${esc(p.cls)}</span></div>
  <div class="text-[11px] text-orange-500 font-bold">${zl(p.budget)}</div>
 </div>
 <div class="p-3 grid sm:grid-cols-2 md:grid-cols-4 gap-x-5 gap-y-1">
  <div>${statBar('OVR (UMIEJĘTNOŚCI)',p.ovr)}${statBar('SPRZĘT',p.equip,'#0ea5e9')}</div>
  <div>${statBar('PROFESJONALIZM',p.prof,'#84cc16')}${statBar('MEDIALNOŚĆ',p.med,'#a855f7')}</div>
  <div>${statBar('MECHANIK ('+p.mech+')',p.mech,'#eab308')}${statBar('LOJALNOŚĆ',p.loyalty,'#ec4899')}</div>
  <div class="text-[11px] space-y-0.5">
    <div class="text-zinc-400">KLUB</div><div class="text-zinc-100 text-[11px]">${club?esc(club.name):'—'}</div>
    <div class="text-zinc-400 mt-1">KONTRAKT</div>
    <div class="${p.contract.type==='Zawodowy'?'text-emerald-400':'text-zinc-300'}">${p.contract.type} · ${zl(p.contract.rate)}/pkt</div>
    <div class="text-zinc-300">Umowa: <b class="text-zinc-200">${p.contract.years} ${lataTxt(p.contract.years)}</b> — do końca sezonu ${G.year+Math.max(0,p.contract.years-1)}</div>
    ${club&&club.debt>0?`<div class="text-red-500 ${club.debt>100000?'blink':''}">ZALEGŁOŚCI: ${zl(club.debt)}</div>`:''}
  </div>
 </div></div>`;
}

/* ---- EKRAN: HUB / MIĘDZYSEZONIE ---- */
function scHub(){
 const p=G.p, club=getClub(p);
 const banInfo = p.banSeasons>0 ? `<div class="brut p-3 mb-3 border-red-900"><div class="text-red-500 font-bold tracking-widest blink">ZAWIESZENIE AKTYWNE: ${p.banSeasons} sezon(y)</div><div class="text-[11px] text-zinc-300">Nie wolno ci startować. Sezon przeleci obok ciebie.</div></div>`:'';
 return head()+`<div class="fade">
 ${playerStrip()}
 ${banInfo}
 ${squadHtml()}
 ${warnings()}
 ${p.contract.type==='Zawodowy'?workshop():amateurNote()}
 ${G.history.length?historyBox():''}
 <div class="brut mt-3">
  <div class="p-4 flex items-center justify-between flex-wrap gap-3">
   <div><div class="text-[11px] text-zinc-300 tracking-widest">SEZON ${G.year} · ${esc(club.name)} · ${G.leagues[p.lk].name}</div>
   <div class="text-[11px] text-zinc-400">Szansa na skład w pojedynczej kolejce (140 symulacji ustawień trenera, z losowaną dyspozycją całej kadry): <b class="text-zinc-200">${appearanceChance(p,club,55,null)}%</b> ${isJun(p)?'· jesteś młodzieżowcem (U21) — masz do dyspozycji numery 1–7, w tym rubrykę młodzieżową':isU24(p)?'· jesteś seniorem U24 — numery 1–5, w tym rubryka U24. Numery 6 i 7 są dla ciebie zamknięte':'· jesteś seniorem — tylko numery 1–5'}
   <span class="block text-zinc-400 mt-0.5">To szansa na JEDNĄ kolejkę przy losowej dyspozycji kadry, a nie gwarancja liczby meczów.
   Powyżej 80% jeździsz praktycznie co tydzień; poniżej 60% to rotacja — jak forma nie wejdzie, sezon potrafi zejść na ławce.</span></div></div>
   <button onclick="startSeason()" class="btn px-7 py-3 font-extrabold tracking-[.2em] text-orange-500">SYMULUJ SEZON ${G.year} &gt;</button>
  </div>
  <div class="px-4 pb-3 text-[11px] ${p.contract.years>1?'text-zinc-400':'text-orange-500'} border-t border-zinc-700 pt-2">
   ${p.contract.years>1
     ? 'KONTRAKT: masz umowę jeszcze na '+p.contract.years+' '+lataTxt(p.contract.years)+' (do końca sezonu '+(G.year+p.contract.years-1)+'). '+
       'Dlatego po tym sezonie NIE zobaczysz ekranu ofert — okienko transferowe otworzy się dopiero po wygaśnięciu umowy.'
     : 'KONTRAKT: to ostatni sezon umowy. Po nim wchodzisz na rynek — zobaczysz ekran ofert i wybierzesz nowy klub oraz długość kontraktu.'}
  </div>
 </div>
 <div class="mt-3 text-right"><button onclick="retire()" class="text-[11px] text-zinc-400 hover:text-red-500 tracking-widest">[ zakończ karierę ]</button></div>
 </div>`;
}
/* Zawodnik-Gracz istnieje w G.riders jako zwykły rider i to jego dane widzi
   trener układający skład. Wiek rośnie w nextYear(), a ageRiders() celowo omija
   Gracza — bez tej synchronizacji podgląd składu pokazywałby 22-latka wciąż
   na numerze młodzieżowym, mimo że silnik w meczu już by go tam nie wpuścił. */
function syncMeRider(){
 const p=G.p, r=G.riders.find(x=>x.me);
 if(!r) return null;
 r.age=p.age; r.name=p.name; r.ovr=p.ovr;
 if(p.club) r.club=p.club;
 return r;
}
/* ---- KADRA KLUBU: z kim realnie walczysz o numer startowy ---- */
function squadHtml(){
 const p=G.p, club=getClub(p);
 syncMeRider();
 const L=bestLineup(club.name, {id:(G.riders.find(r=>r.me)||{}).id, v:p.loyalty*0.10});
 if(!L) return '';
 const numOf={}; for(let n=1;n<=7;n++) if(L[n]) numOf[L[n].id]=n;
 const sq=squadOf(club.name).sort((a,b)=>(numOf[a.id]||99)-(numOf[b.id]||99)||b.ovr-a.ovr);
 const meNum=numOf[(G.riders.find(r=>r.me)||{}).id];
 return `<div class="brut mb-3"><div class="brut-h px-3 py-1.5 text-[11px] text-orange-500 font-bold flex justify-between flex-wrap gap-2">
   <span>KADRA — ${esc(club.name)}</span>
   <span class="${meNum?'text-emerald-400':'text-red-500'}">${meNum?'JEDZIESZ Z NUMEREM '+meNum:'POZA SIÓDEMKĄ — OGLĄDASZ Z PARKINGU'}</span></div>
 <div class="p-2 overflow-x-auto">
 <table class="w-full text-[11px]">
 <thead><tr class="text-[11px] text-zinc-400 tracking-widest border-b border-zinc-700">
  <th class="text-left">NR</th><th class="text-left">ZAWODNIK</th><th>WIEK</th><th class="text-left">KATEGORIA</th><th>OVR</th><th>FORMA</th><th>WARTOŚĆ</th><th class="text-left">STATUS</th></tr></thead>
 <tbody>${sq.map(r=>{
   const n=numOf[r.id];
   const fm=Math.round((r.form||0)*10)/10;
   const val=Math.round(r.ovr+(r.form||0)*LINEUP_FORM_W);
   const st = n
     ? (n<=5 ? 'pierwsza piątka'+(isJun(r)?' (młodzieżowiec)':isU24(r)?' (rubryka U24)':' (senior)')
             : 'numer młodzieżowy '+n+' — tylko U21')
     : (r.strike?'BUNT — nie wyjeżdża':'poza składem');
   return `<tr class="${r.me?'rowhl':''} border-b border-zinc-700/60">
   <td class="${n?'text-orange-400 font-bold':'text-zinc-400'} w-8">${n||'—'}</td>
   <td class="${r.me?'text-orange-400 font-bold':'text-zinc-200'} truncate max-w-[190px]">${esc(r.name)}${r.me?' (TY)':''}</td>
   <td class="text-center text-zinc-300">${r.age}</td>
   <td class="${catCol(r)} text-[11px]">${catOf(r)}</td>

function buyTuner(i){const t=TUNERS[i],p=G.p;
 if(p.budget<t.c || p.prof<(t.prof||0)) return;
 p.budget-=t.c; p.shop.spent+=t.c; p.shop.bought.push(i);
 if(t.risk&&chance(t.risk)){const g=Math.max(0,Math.round(t.e*0.2)-4);p.equip=cl(p.equip+g,1,99);p.shop.equipGain+=g;
   p.shop.log.push(t.n+' — BUBEL, sprzęt ledwo drgnął ('+(g>=0?'+':'')+g+')');}
 else {p.equip=cl(p.equip+t.e,1,99);p.shop.equipGain+=t.e;p.shop.log.push(t.n+' (+'+t.e+' Sprzęt)');}
 render();}
function hireMech(i){const m=MECHS[i],p=G.p;
 if(p.budget<m.c || p.mechName===m.n || p.prof<(m.prof||0)) return;
 p.budget-=m.c; p.shop.spent+=m.c; p.mech=m.q; p.mechName=m.n;
 p.shop.log=p.shop.log.filter(l=>!l.startsWith('Mechanik: '));
 p.shop.log.push('Mechanik: '+m.n+' (jakość '+m.q+')'); p.shop.mechHired=true; render();}

/* ---- PRZEJŚCIE DO KOLEJNEGO ROKU ---- */
function nextYear(){
 const p=G.p;
 if(G.nextIMP){G.recIMP=G.nextIMP;G.nextIMP=null;}
 if(G.nextMimpChamp){G.recMIMP=G.nextMimpChamp;G.nextMimpChamp=null;}
 ageRiders();
 p.age++; G.year++;
 syncMeRider();                       // Gracz też się starzeje — także w oczach trenera
 if(p.banSeasons>0) p.banSeasons--;
 p.contract.years--;
 // rozwój klubów
 LKEYS.forEach(k=>G.leagues[k].clubs.forEach(c=>{c.mood=R(20,90);}));
 if(p.age>=40){ retire('Wiek. Ciało powiedziało dość.'); return; }
 const noRenew = G.S ? G.S.noRenew : false;
 if(p.contract.years<=0 || noRenew){
   if(noRenew) p.next.noRenew=true;
   _offers=[]; G.screen='sign'; render(); return;
 }
 G.screen='hub'; render();
}
function skipYear(){
 const p=G.p, y=G.year;
 // liga żyje dalej także wtedy, gdy ty siedzisz w domu
 allClubs().forEach(clubSeasonBudget);
 clubEconomy();
 ageRiders();
 const loss=R(1,4);
 p.ovr=cl(p.ovr-loss,1,99);
 p.med=cl(p.med-R(5,12),0,99);
 p.equip=cl(p.equip-R(3,8),1,99);
 p.loyalty=0;
 p.idleYears=(p.idleYears||0)+1;
 p.idleLog=p.idleLog||[];
 p.idleLog.unshift(y+': cały rok bez klubu — OVR -'+loss+', medialność w dół, sprzęt rdzewieje w garażu'+
   (p.banSeasons>0?' (trwa zawieszenie)':''));
 if(p.idleLog.length>4) p.idleLog.pop();
 p.age++; G.year++;
 syncMeRider();
 if(p.banSeasons>0) p.banSeasons--;
 if(p.age>=40){retire('Wiek i brak klubu.');return;}
 if(p.idleYears>=3){retire('Trzy lata bez klubu. Kariera skończyła się bez ogłoszenia.');return;}
 _offers=[]; G.screen='sign'; render();
}

   8. PAMIĄTKOWA KARTA STATYSTYK — "SportoweMity.pl"
   Ukryty kontener (poza ekranem, ale wyrenderowany — html2canvas nie
   potrafi sfotografować display:none) stylizowany na portal sportowy
   w barwach zielono-białych. Z tego robi się PNG na pamiątkę kariery.
   ============================================================ */
const SM={g:'#0f8a3d', gd:'#0a6b2f', gl:'#eaf6ee', gl2:'#f6fbf7', bd:'#d5e3d9',
          tx:'#1f2937', mu:'#6b7280', rd:'#c81e1e'};

/* Rozbicie kodów z linii meczowych: miejsca w biegach + biegi nieukończone.
   Silnik notuje "d" (defekt) i "w" (wykluczenie); kolumny U (upadek) i T (taśma)
   zostają w tabeli dla zgodności z układem portalu i czekają na dane. */
function smCodes(h){
 const s={I:0,II:0,III:0,IV:0,D:0,U:0,W:0,T:0};
 (h.lines||[]).forEach(L=>{
   if(!L.rode || !L.codes) return;
   L.codes.forEach(c=>{
     if(c==='-') return;                       // zmieniony przez rezerwę — to nie był start
     if(c==='d'){s.D++;return;}
     if(c==='u'){s.U++;return;}
     if(c==='w'){s.W++;return;}
     if(c==='t'){s.T++;return;}
     const v=parseInt(c,10);
     if(v===3)s.I++; else if(v===2)s.II++; else if(v===1)s.III++; else if(v===0)s.IV++;
   });
 });
 return s;
}
/* Kluby z kariery — kolejne "przystanki", sklejone po sąsiadujących sezonach. */
function smClubs(){
 const out=[];
 G.history.forEach(h=>{
   const last=out[out.length-1];
   if(last && last.club===h.club){
     last.to=h.year; last.seasons++; last.pts+=h.pts; last.matches+=h.matches;
     if(!last.leagues.includes(h.league)) last.leagues.push(h.league);
     last.debt += (h.settle&&h.settle.unpaid)||0;
   } else out.push({club:h.club, leagues:[h.league], from:h.year, to:h.year,
                    seasons:1, pts:h.pts, matches:h.matches,
                    debt:(h.settle&&h.settle.unpaid)||0});
 });
 return out;
}
/* "1 klub", "2 kluby", "7 klubów" — portal ma wyglądać poważnie. */
const smKlub = n => n===1 ? 'klub'
  : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20)) ? 'kluby' : 'klubów';
const smUnpaid = h => (h.settle && h.settle.unpaid) || 0;
const smPzm    = h => (h.settle && h.settle.pzmEarned) || 0;

    <div style="background:${SM.g};color:#fff;font-size:13px;font-weight:bold;padding:6px 10px">KLUBY Z KARIERY</div>
    <div style="border:1px solid ${SM.bd};border-top:none;padding:10px">
      ${clubs.length ? clubs.map(k=>`<span style="display:inline-block;border:1px solid ${SM.bd};
        border-left:4px solid ${SM.g};background:${SM.gl2};padding:6px 10px;margin:0 6px 6px 0;font-size:12px">
        <b style="color:${SM.g}">${esc(k.club)}</b>
        <span style="color:${SM.mu}"> · ${k.from}${k.to!==k.from?'–'+k.to:''} · ${k.seasons} sez. ·
        <span style="color:${SM.g}">${k.leagues.map(esc).join(' / ')}</span> · ${k.pts} pkt</span>
        ${k.debt?`<span style="color:${SM.rd};font-weight:bold"> · dług ${zl(k.debt)}</span>`:''}
      </span>`).join('') : `<span style="font-size:12px;color:${SM.mu}">Brak rozegranych sezonów.</span>`}
    </div>
  </div>

  <!-- ===== ZAKŁADKI + TABELA ===== -->
  <div style="padding:0 22px 6px 22px">${tabs}</div>
  <div style="padding:0 22px 10px 22px">
   <table style="width:100%;border:1px solid ${SM.bd}">
    <thead><tr>
      ${TH('ROK',52)}${TH('WIEK',44)}${TH('LIGA',62)}${TH('KLUB',null,'left')}
      ${TH('M',36)}${TH('B',36)}${TH('I',32)}${TH('II',32)}${TH('III',32)}${TH('IV',32)}
      ${TH('D',30)}${TH('U',30)}${TH('W',30)}${TH('T',30)}
      ${TH('PKT',46)}${TH('BON',42)}${TH('ŚR./B',56)}${TH('OCENA',104)}${TH('DŁUG',96)}
    </tr></thead>
    <tbody>
      ${rows || `<tr><td colspan="19" style="padding:14px;text-align:center;font-size:12px;color:${SM.mu}">Brak sezonów w archiwum.</td></tr>`}
      <tr style="background:${SM.gl};border-top:2px solid ${SM.g}">
        ${TD('ŁĄCZNIE','font-weight:bold;color:'+SM.gd)}${TD('')}${TD('LIGA','font-size:10px;color:'+SM.gd)}
        ${TD(clubs.length+' '+smKlub(clubs.length),'text-align:left;color:'+SM.gd+';font-weight:bold;padding-left:8px')}
        ${TD(tot.M,'font-weight:bold')}${TD(tot.B,'font-weight:bold')}
        ${TD(tot.I,'font-weight:bold')}${TD(tot.II,'font-weight:bold')}${TD(tot.III,'font-weight:bold')}${TD(tot.IV,'font-weight:bold')}
        ${TD(tot.D,'font-weight:bold;color:'+SM.rd)}${TD(tot.U,'font-weight:bold')}${TD(tot.W,'font-weight:bold;color:'+SM.rd)}${TD(tot.T,'font-weight:bold')}
        ${TD(tot.P,'font-weight:bold;font-size:14px')}${TD(tot.BON,'font-weight:bold;color:#1d4ed8')}
        ${TD(totAvg,'font-weight:bold;background:#fff')}${TD('KARIERA','font-size:10px;font-weight:bold;color:'+SM.gd)}
        ${TD(tot.DL?'−'+zl(tot.DL):'0 zł','font-weight:bold;color:'+SM.rd+';white-space:nowrap')}
      </tr>
    </tbody>
   </table>
   <div style="font-size:10px;color:${SM.mu};padding:6px 2px;line-height:1.6">
     M — mecze ligowe (runda zasadnicza) · B — biegi (starty) · I / II / III / IV — miejsca w biegach ·
     D — defekt · U — upadek · W — wykluczenie · T — taśma · ŚR./B — średnia biegopunktowa ·
     DŁUG — kwota, której klub nie przelał w danym sezonie.
     ${totalPzm?`Startowe i kilometrówka PZM przez całą karierę: <b style="color:${SM.g}">${zl(totalPzm)}</b>.`:''}
     Biegi zdjęte przez rezerwę taktyczną nie wchodzą do statystyki startów.
   </div>
  </div>

  <!-- ===== WIELKI CZERWONY NAPIS ===== -->
  <div style="margin:4px 22px 0 22px;border:3px solid ${SM.rd};background:#fff5f5;padding:16px;text-align:center">
    <div style="font-size:12px;color:${SM.rd};letter-spacing:.18em;font-weight:bold">BILANS ZAMKNIĘCIA KARIERY</div>
    <div style="font-size:27px;font-weight:bold;color:${SM.rd};line-height:1.25;margin-top:6px">
      CAŁKOWITE NIEZAPŁACONE ZALEGŁOŚCI W KARIERZE: ${zl(totalUnpaid)}
    </div>
    ${wiped?`<div style="font-size:13px;color:${SM.rd};margin-top:6px">w tym ${zl(wiped)} umorzone przez syndyka — masa upadłościowa nie wypłaciła nic</div>`:''}
  </div>

  <!-- ===== STOPKA ===== -->
  <div style="margin-top:16px;background:${SM.gd};color:#bfe6cd;font-size:11px;padding:10px 22px">
    <span style="float:left">SportoweMity.pl · dane z archiwum PATO-ŻUŻEL · przedruk za zgodą prezesa (ustną, w busie)</span>
    <span style="float:right">wygenerowano ${today}</span>
    <div style="clear:both"></div>
  </div>

 </div></div>`;
}

/* Zrzut karty do PNG. Kontener stoi poza ekranem, więc w klonie dokumentu
   przestawiamy go na pozycję normalną — inaczej html2canvas fotografuje pustkę. */
function downloadCareerPNG(btn){
 const el=document.getElementById('smCard');
 if(!el) return;
 if(typeof html2canvas!=='function'){
   alert('Nie udało się wczytać biblioteki html2canvas (brak połączenia z CDN). Karta nie zostanie wygenerowana.');
   return;
 }
 const old = btn ? btn.innerHTML : null;
 if(btn){ btn.innerHTML='GENERUJĘ KARTĘ...'; btn.disabled=true; }
 html2canvas(el,{
   backgroundColor:'#ffffff', scale:2, logging:false, useCORS:true,
   width:el.offsetWidth, height:el.offsetHeight, windowWidth:1400,
   onclone:doc=>{ const w=doc.getElementById('smCardWrap');
     if(w){ w.style.position='static'; w.style.left='0'; w.style.top='0'; w.style.zIndex='0'; } }
 }).then(canvas=>{
   const slug = (G.p.name||'zawodnik').toLowerCase()
     .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l').replace(/ń/g,'n')
     .replace(/ó/g,'o').replace(/ś/g,'s').replace(/[żź]/g,'z')
     .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
   const a=document.createElement('a');
   a.download='sportowemity-'+(slug||'zawodnik')+'-kariera.png';
   a.href=canvas.toDataURL('image/png');
   document.body.appendChild(a); a.click(); a.remove();
 }).catch(e=>{
   alert('Nie udało się wygenerować karty: '+e);
 }).then(()=>{ if(btn){ btn.innerHTML=old; btn.disabled=false; } });
}

/* ---- EKRAN KOŃCA KARIERY ---- */
function retire(reason){
 G.p.retired=true; G.p.retireReason=reason||'Decyzja własna.';
 G.screen='end'; render();
}
function scEnd(){
 const p=G.p, c=p.career;
 const avg = c.heats>0 ? (c.pts/c.heats).toFixed(2) : '0.00';
 let verdict;
 if((c.indTitles||0)>0 && +avg>2.0) verdict='INDYWIDUALNY MISTRZ POLSKI. Puchar im. Józefa Dochy stał u ciebie na kredensie. Rondo to kwestia czasu.';
 else if(c.titles>0 && +avg>2.0) verdict='LEGENDA. Twoje nazwisko wyryte na trybunie. Ktoś nazwie tobą rondo.';
 else if(+avg>1.8) verdict='KLASOWY ZAWODNIK. Portale nazwą cię „filarem ligi”, a potem zapomną w trzy lata.';
 else if(+avg>1.3) verdict='SOLIDNY RZEMIEŚLNIK. Nie zachwycałeś, ale wypełniałeś rubrykę i płacili.';
 else if(+avg>0.8) verdict='ZAWODNIK OD PARZYSTEJ. Jeździłeś, żeby klub nie miał kar. Też ktoś musi.';
 else verdict='PATO-ŻUŻEL W CZYSTEJ POSTACI. Więcej defektów niż punktów. Legenda internetu, nie toru.';
 return head()+`<div class="fade">
 <div class="brut border-red-900 mb-3"><div class="brut-h px-3 py-1.5 text-[11px] text-red-500 font-bold">KONIEC KARIERY</div>
 <div class="p-5">
  <div class="text-2xl font-extrabold text-zinc-100 mb-1">${esc(p.name)}</div>
  <div class="text-[11px] text-zinc-400 mb-4">${esc(p.cls)} · zakończył w wieku ${p.age} lat · ${esc(p.retireReason)}</div>
  <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2 mb-4">
   ${kpi('SEZONY',c.seasons)}${kpi('MECZE',c.matches)}${kpi('BIEGI',c.heats)}
   ${kpi('PUNKTY',c.pts,'text-orange-400')}${kpi('BONUSOWE',c.bon||0,'text-sky-400')}${kpi('DEFEKTY',c.def,'text-red-500')}${kpi('WYKLUCZENIA',c.exc,'text-red-400')}
   ${kpi('ŚR. KARIERY',avg,'text-emerald-400')}
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-4">
   ${kpi('MISTRZOSTWA LIGI',c.titles,'text-yellow-400')}
   ${kpi('TYTUŁY INDYWIDUALNE',c.indTitles||0,'text-yellow-400')}
   ${kpi('MEDALE INDYWIDUALNE',c.medals||0,'text-zinc-100')}
   ${kpi('NAJLEPSZA ŚREDNIA',c.best,'text-emerald-400')}${kpi('ZAROBIONE',zl(c.earned),'text-orange-400')}
  </div>
  ${c.dmpjStarts?`<div class="text-[11px] text-zinc-300 mb-3">DMPJ: ${c.dmpjStarts} turniejów, ${c.dmpjPts||0} punktów${c.dmpjTitles?`, <b class="text-pink-400">${c.dmpjTitles}× drużynowe mistrzostwo Polski juniorów</b>`:''}.</div>`:''}
  ${c.pzmEarned?`<div class="text-[11px] text-zinc-300 mb-3">Startowe i kilometrówka PZM przez całą karierę: <b class="text-emerald-400">${zl(c.pzmEarned)}</b>.</div>`:''}
  <div class="brut p-4 text-[13px] text-zinc-200 border-l-2 border-orange-700">${verdict}</div>
 </div></div>

 <div class="brut mb-3" style="border-color:#14532d">
  <div class="brut-h px-3 py-1.5 text-[11px] font-bold" style="border-color:#14532d;color:#22c55e">PAMIĄTKA — KARTA STATYSTYK "SportoweMity.pl"</div>
  <div class="p-4 flex items-center justify-between flex-wrap gap-3">
   <div class="text-[11px] text-zinc-300 max-w-xl">
    Cała kariera na jednej planszy w barwach portalu: kluby, sezon po sezonie, miejsca w biegach,
    defekty, wykluczenia i — na samym dole, wielkim czerwonym drukiem — suma tego, czego kluby
    nigdy ci nie przelały: <b class="text-red-500">${zl(unpaidCareerTotal())}</b>.
   </div>
   <button onclick="downloadCareerPNG(this)" class="btn px-6 py-3 font-extrabold tracking-[.15em]"
     style="color:#22c55e;border-color:#166534">POBIERZ KARTĘ (PNG) &darr;</button>
  </div>
 </div>

 ${G.history.length?historyBox():''}
 <button onclick="restart()" class="btn px-7 py-3 font-extrabold tracking-[.2em] text-orange-500">NOWA KARIERA &gt;</button>
 ${careerCardHtml()}
 </div>`;
}
const unpaidCareerTotal = () => G.history.reduce((a,h)=>a+smUnpaid(h),0);
function restart(){G=newGame();evHist=[];render();}

/* ---- BOOT ---- */
G=newGame(); render();
</script>
</body>
