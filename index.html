*{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
body{background:#050505;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0px,rgba(255,255,255,.018) 1px,transparent 1px,transparent 3px)}
::-webkit-scrollbar{width:9px;height:9px}

::-webkit-scrollbar-thumb{background:#2a2a2a;border:1px solid #000}

.brut{border:1px solid #71717a;background:#0e0e0e}
.brut-h{border-bottom:1px solid #71717a;background:#1c1c1f;letter-spacing:.12em}
.btn{border:1px solid #71717a;background:#1c1c1f;color:#f4f4f5;transition:none}
.btn:hover{background:#f97316;border-color:#fdba74;color:#000}
.btn:active{transform:translate(1px,1px)}
.btn-d{border:1px solid #dc2626;background:#2a0d0d;color:#fecaca}
.btn-d:hover{background:#ef4444;border-color:#fca5a5;color:#000}
.glow{text-shadow:0 0 12px rgba(249,115,22,.55)}
.blink{animation:bl 1.1s steps(2,start) infinite}

.bar{height:9px;background:#27272a;border:1px solid #71717a;position:relative;overflow:hidden}
.bar>i{display:block;height:100%;background:#f97316}
table{border-collapse:collapse}
td,th{padding:3px 7px}
.rowhl{background:rgba(249,115,22,.20);outline:1px solid rgba(251,146,60,.85)}
select,input{background:#131316;border:1px solid #71717a;color:#f4f4f5;padding:6px 9px;outline:none}
select:focus,input:focus{border-color:#fb923c;box-shadow:0 0 0 2px rgba(251,146,60,.35)}
.fade{animation:fi .18s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- ROZWIJANE SEKCJE (accordion) ----
   .acc  = samodzielny boks (własna ramka, jak .brut) na drugorzędne dane.
   .acc-lite = lżejsza wersja, do wpięcia WEWNĄTRZ istniejącego .brut
   (bez własnej ramki — tylko górna linia), np. akapit z wyjaśnieniem
   pod tabelą. Obie wersje jasno pokazują "ROZWIŃ ▸" / "ZWIŃ ▾", więc
   nic nie chowa się bez śladu. */
.acc{border:1px solid #71717a;background:#0e0e0e;margin-top:.65rem}
.acc>summary{cursor:pointer;list-style:none;padding:6px 12px;background:#1c1c1f;display:flex;justify-content:space-between;align-items:center;gap:10px;user-select:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:hover{background:#27272a}
.acc>.acc-body{padding:10px 12px}
.acc-ind{font-size:10px;color:#a1a1aa;white-space:nowrap;flex-shrink:0;border:1px solid #52525b;padding:2px 7px;letter-spacing:.08em}
.acc:not([open])>summary .acc-ind::before{content:'▸ ROZWIŃ'}
.acc[open]>summary .acc-ind::before{content:'▾ ZWIŃ'}
.acc>summary:hover .acc-ind{border-color:#fb923c;color:#fdba74}

.acc-lite{border-top:1px dashed #3f3f46;margin-top:10px}
.acc-lite>summary{cursor:pointer;list-style:none;padding-top:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;user-select:none}
.acc-lite>summary::-webkit-details-marker{display:none}
.acc-lite>.acc-lite-body{padding-top:7px}
.acc-lite-ind{font-size:10px;color:#71717a;white-space:nowrap;flex-shrink:0}
.acc-lite:not([open])>summary .acc-lite-ind::before{content:'▸ rozwiń szczegóły'}
.acc-lite[open]>summary .acc-lite-ind::before{content:'▾ zwiń'}
.acc-lite>summary:hover .acc-lite-ind{color:#fdba74}
.acc-lite>summary:hover .acc-lite-t{color:#fb923c}

/* ---- PAMIĄTKOWA KARTA "SportoweMity.pl" ----
   Kontener stoi poza ekranem (nie display:none — html2canvas musi go wyrenderować).
   Własna typografia: karta ma wyglądać jak portal, a nie jak terminal. */
#smCardWrap{position:fixed;left:-14000px;top:0;z-index:-1;pointer-events:none;opacity:1}
#smCard,#smCard *{font-family:Arial,Helvetica,'Segoe UI',sans-serif !important;box-sizing:border-box}
#smCard table{border-collapse:collapse}
#smCard td,#smCard th{padding:0}
</style>
</head>
<body class="text-zinc-200 text-[13px] leading-snug">
<div id="app" class="max-w-6xl mx-auto p-3 sm:p-5"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
/* ============================================================
   PATO-ŻUŻEL :: SYMULATOR KARIERY POLSKIEGO ŻUŻLOWCA
   Logika interfejsu (UI): ekrany, renderowanie HTML, obsługa
   interakcji. Wymaga wcześniejszego wczytania data.js i engine.js.
   ============================================================ */

/* ---- KATEGORIE WIEKOWE (jedno źródło prawdy dla całego UI) ----
   Silnik zna tylko twardy warunek: junior = U21. Powyżej 21 lat nikt nie jest
   już "juniorem" — jest U24 (do 24. roku życia włącznie) albo seniorem. */
/* "1 rok", "2 lata", "5 lat" — pojawia się przy każdej ofercie kontraktu. */
const lataTxt = n => n===1 ? 'rok'
  : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20)) ? 'lata' : 'lat';

const catOf    = r => isJun(r) ? 'JUNIOR (U21)' : isU24(r) ? 'U24' : 'SENIOR';
const catShort = r => isJun(r) ? 'U21' : isU24(r) ? 'U24' : 'SENIOR';
const catCol   = r => isJun(r) ? 'text-pink-400' : isU24(r) ? 'text-sky-400' : 'text-zinc-300';
const sezTxt = n => n===1 ? 'sezon'
  : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20)) ? 'sezony' : 'sezonów';

/* ---- ROZWIJANE SEKCJE: dwie odmiany tego samego wzorca ----
   Zamiast piętrzyć osobne ".brut" boksy jeden pod drugim (stąd skarga
   graczy — "za dużo małych okienek, wszystko się zlewa"), drugorzędne
   dane (wyjaśnienia, wyliczenia, "co jeszcze się wydarzyło") chowamy
   za jawnym, podpisanym przełącznikiem. Domyślnie ZAMKNIĘTE, chyba że
   opts.open=true — najważniejsze liczby i tak zostają widoczne bez klikania,
   bo trafiają do wywołania spoza acc()/accLite().
   acc()     — samodzielny boks z własną ramką (używaj między innymi boksami).
   accLite() — lekka wersja BEZ ramki, do wpięcia wewnątrz istniejącego boksu. */
function acc(title, body, opts={}){
 if(!body) return '';
 const {open=false, badge='', tone='text-orange-600'} = opts;
 return `<details class="acc"${open?' open':''}>
  <summary><span class="${tone} font-bold tracking-widest text-[11px]">${title}${badge?` <span class="text-zinc-500 font-normal normal-case tracking-normal">— ${esc(badge)}</span>`:''}</span>
  <span class="acc-ind"></span></summary>
  <div class="acc-body">${body}</div>
 </details>`;
}
function accLite(title, body, opts={}){
 if(!body) return '';
 const {open=false, badge='', tone='text-zinc-400'} = opts;
 return `<details class="acc-lite"${open?' open':''}>
  <summary><span class="acc-lite-t ${tone} tracking-widest text-[11px]">${title}${badge?` <span class="text-zinc-500 normal-case tracking-normal">— ${esc(badge)}</span>`:''}</span>
  <span class="acc-lite-ind"></span></summary>
  <div class="acc-lite-body">${body}</div>
 </details>`;
}

/* Kod "1*"/"2*" oznacza bieg z bonusem (art. 720). Renderujemy trailing '*'
   jako czytelną gwiazdkę ★ zamiast gołej "*" — na życzenie graczy, którzy
   zgłaszali, że bonus "nie widać" przy wynikach poszczególnych biegów: sam
   asterisk ginął wzrokowo obok "*liczba" (Twój dorobek meczowy) w tej samej
   linijce, mimo że dane były poprawne. Surowy format z '*' w `codes` (dane)
   zostaje bez zmian — liczy się go dalej jak dotąd (parseInt, endsWith). */
const bonusStar = c => c.endsWith('*') ? c.slice(0,-1)+'★' : c;
function codesHtml(codes){
 return codes.map(c=> c==='d'?'<span class="text-red-500">d</span>'
   : c==='w'?'<span class="text-red-400">w</span>'
   : c==='-'?'<span class="text-zinc-400">-</span>'
   : c.endsWith('*')?'<span class="text-sky-400" title="bieg z bonusem">'+bonusStar(c)+'</span>' : c).join(',');
}

/* ============================================================
   7. RENDER
   ============================================================ */
const app=()=>document.getElementById('app');
function render(){
 const s=G.screen;
 app().innerHTML =
   s==='create'  ? scCreate() :
   s==='sign'    ? scSign()   :
   s==='hub'     ? scHub()    :
   s==='renew'   ? scRenew()  :
   s==='event'   ? scEvent()  :
   s==='evsum'   ? scEvSum()  :
   s==='winter'  ? scWinter() :
   s==='tribunal'? scTribunal():
   s==='mech'    ? scMech()   :
   s==='summary' ? scSummary():
   s==='end'     ? scEnd()    : '';
 window.scrollTo({top:0});
}

function head(){
 return `<div class="mb-4 border-b border-zinc-700 pb-2 flex items-end justify-between flex-wrap gap-2">
  <div><div class="text-orange-500 font-extrabold tracking-[.3em] text-lg glow">POLSKI ŻUŻLOWIEC SIMULATOR</div>
  <div class="text-[11px] text-zinc-400 tracking-[.25em]">SYMULATOR KARIERY // ROK ${G.year}</div></div>
  <div class="text-[11px] text-zinc-400 text-right">jedno kliknięcie = jeden sezon</div></div>`;
}
function statBar(l,v,col='#f97316'){
 return `<div class="mb-1.5"><div class="flex justify-between text-[11px] text-zinc-300 tracking-wider"><span>${l}</span><span class="text-zinc-200">${v}</span></div>
 <div class="bar"><i style="width:${cl(v,0,99)}%;background:${col}"></i></div></div>`;
}

/* ---- EKRAN: TWORZENIE ---- */
function scCreate(){
 return head()+`<div class="fade">
 <div class="brut mb-4"><div class="brut-h px-3 py-1.5 text-[11px] text-orange-500 font-bold">TWORZENIE ZAWODNIKA // WIEK STARTOWY: 16 LAT</div>
 <div class="p-4 space-y-4">
   <div><label class="block text-[11px] text-zinc-300 tracking-widest mb-1">IMIĘ I NAZWISKO</label>
   <div class="flex gap-2 flex-wrap items-center">
     <input id="pname" maxlength="28" value="${esc(suggestName())}" class="w-full sm:w-96">
     <button onclick="rollName()" class="btn px-3 py-2 text-[11px] font-bold tracking-widest text-orange-500">LOSUJ</button>
   </div>
   <div class="text-[11px] text-zinc-400 mt-1">Propozycja jest losowana z puli imion i nazwisk. Możesz ją nadpisać własną.</div></div>
   <div><label class="block text-[11px] text-zinc-300 tracking-widest mb-2">KLASA POSTACI</label>
   <div class="grid sm:grid-cols-2 gap-2">
   ${CLASSES.map(c=>`<label class="brut p-3 cursor-pointer hover:border-orange-600 block">
     <div class="flex items-start gap-2"><input type="radio" name="cls" value="${c.id}" ${c.id==='bez'?'checked':''} class="mt-1 accent-orange-500">
     <div><div class="font-bold text-zinc-100">${c.n}</div>
     <div class="text-[11px] text-orange-600 tracking-widest">OVR ${c.ovr[0]}–${c.ovr[1]}</div>
     <div class="text-[11px] text-zinc-300 mt-1">${c.d}</div></div></div></label>`).join('')}
   </div></div>
   <div class="text-[11px] text-zinc-400 border-l-2 border-zinc-700 pl-3">
   Startujesz na kontrakcie <b class="text-zinc-300">amatorskim</b>: darmowy sprzęt klubowy, grosze za punkty, zero kasy za podpis.<br>
   Budżet: 0 zł &nbsp;·&nbsp; Sprzęt: 20 &nbsp;·&nbsp; Profesjonalizm i Medialność: ukryte, zależne od klasy.</div>
   <button onclick="doCreate()" class="btn px-6 py-2.5 font-bold tracking-widest text-orange-500">ZACZYNAM KARIERĘ &gt;</button>
 </div></div>
 ${infoBox()}
 ${changelogBox()}
 </div>`;
}
/* ---- EKRAN TYTUŁOWY: ZGŁASZANIE BŁĘDÓW I ZASTRZEŻENIE ---- */
function infoBox(){
 return `<div class="brut mb-4" style="border-color:#a16207">
  <div class="brut-h px-3 py-1.5 text-[11px] font-bold" style="border-color:#a16207;color:#eab308">
    INFORMACJE // OSTATNI UPDATE: ${GAME_UPDATE}</div>
  <div class="p-4 space-y-2 text-[12px] text-zinc-200 leading-relaxed">
   <div><b style="color:#eab308">Wszelkie bugi proszę zgłaszać, oznaczając profil twórcy
     <span class="text-zinc-100">${GAME_X}</span> na X.</b></div>
<div><b style="color:#eab308">Gra jest w wersji beta. Brakuje wiele ważnych turniejów, takich jak Turniej Szkoleniowy, reprezentacji narodowej, czy choćby Indywidualnych Mistrzostw Świata. Wszystko będzie dodawane sukcesywnie w updateach.
   <div class="text-zinc-300">Podobieństwo do wszelkich wydarzeń, nazwisk i klubów do rzeczywistości jest przypadkowe.</div>
   <div class="text-[11px] text-zinc-400">Ostatni update: <b class="text-zinc-300">${GAME_UPDATE}</b></div>
  </div></div>`;
}
/* ---- EKRAN TYTUŁOWY: CHANGELOG ---- */
function changelogBox(){
 if(typeof CHANGELOG==='undefined' || !CHANGELOG.length) return '';
 return `<div class="brut mb-4">
  <div class="brut-h px-3 py-1.5 text-[11px] text-orange-500 font-bold">CHANGELOG — CO SIĘ ZMIENIŁO</div>
  <div class="p-3 space-y-3">
   ${CHANGELOG.map((c,i)=>`<details ${i===0?'open':''} class="border border-zinc-700">
     <summary class="cursor-pointer px-3 py-1.5 text-[11px] tracking-widest text-orange-400 select-none">
       ${esc(c.v)} — ${esc(c.t)}</summary>
     <ul class="px-3 py-2 text-[11px] text-zinc-300 space-y-1 border-t border-zinc-700">
       ${c.l.map(x=>'<li>› '+esc(x)+'</li>').join('')}</ul>
   </details>`).join('')}
  </div></div>`;
}
/* Przelosowanie propozycji bez przeładowania całego ekranu (radio klasy postaci
   i tak zostaje tam, gdzie było). */
function rollName(){
 const el=document.getElementById('pname'); if(el) el.value=suggestName();
}
function doCreate(){
 const n=document.getElementById('pname').value.trim()||'Bezimienny Grajek';
 const c=document.querySelector('input[name=cls]:checked').value;
 G.p=newPlayer(n,c);
 genAllSquads();
 const meR=makeRider(G.p.age, G.p.ovr); meR.me=true; meR.name=G.p.name; G.riders.push(meR);
 G.screen='sign'; render();
}

/* ============================================================
   BOKS: DLACZEGO STARY KLUB NIE ZŁOŻYŁ OFERTY
   Silnik (makeOffers → renewRejection) zapisuje powód do G.noRenew.
   Bez tego brak przedłużenia wyglądał jak bug: telefon milczy i tyle.
   ============================================================ */
function noRenewBox(){
 const n=G.noRenew; if(!n) return '';
 const col={behave:'#dc2626', sport:'#f59e0b', money:'#f59e0b', gone:'#dc2626', squad:'#a1a1aa'}[n.code]||'#a1a1aa';
 return `<div class="brut mb-3" style="border-color:${col}">
  <div class="brut-h px-3 py-1.5 text-[11px] font-bold" style="border-color:${col};color:${col}">
    BEZ PRZEDŁUŻENIA — ${esc(n.club)} ${n.lk?'· '+G.leagues[n.lk].short:''}</div>
  <div class="p-3">
   <div class="text-[12px] font-bold mb-1" style="color:${col}">${esc(n.t)}</div>
   <div class="text-[11px] text-zinc-200 leading-relaxed mb-2">${esc(n.x)}</div>
   <div class="text-[12px] text-zinc-300 border-l-2 pl-3 italic" style="border-color:${col}">
     ${esc(n.quote)} <span class="text-[11px] text-zinc-500 not-italic">— były pracodawca</span></div>
   ${n.tip?`<div class="text-[11px] text-zinc-400 mt-2">› ${esc(n.tip)}</div>`:''}
  </div></div>`;
}

/* ---- EKRAN: PODPISANIE KONTRAKTU ---- */
let _offers=[];
function scSign(){
 const p=G.p;
 if(!_offers.length){
   if(p.club===null){ G.noRenew=null; _offers=firstOffers(); }
   else _offers=makeOffers();
 }
 const offers=_offers;
 if(!offers.length){
   const idle=p.idleYears||0;
   return head()+`<div class="brut border-red-900 fade">
   <div class="brut-h px-3 py-1.5 text-[11px] text-red-500 font-bold" style="border-color:#7f1d1d">RYNEK TRANSFEROWY ${G.year} // BRAK OFERT</div>
   <div class="p-5">
   <div class="text-zinc-300 mb-3">Żaden klub w Polsce nie chce cię widzieć na torze. Telefon milczy.</div>
   ${marketBox()}
   ${noRenewBox()}
   <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
     ${kpi('WIEK',p.age)}${kpi('OVR',p.ovr)}${kpi('LATA BEZ KLUBU',idle,idle>=2?'text-red-500':'text-zinc-100')}${kpi('BUDŻET',zl(p.budget),'text-orange-400')}
   </div>
   ${p.idleLog&&p.idleLog.length?`<div class="brut p-3 mb-4"><div class="text-[11px] text-zinc-400 tracking-widest mb-1">CO SIĘ DZIAŁO</div>
     <ul class="text-[11px] text-zinc-300 space-y-0.5">${p.idleLog.map(l=>'<li>› '+esc(l)+'</li>').join('')}</ul></div>`:''}
   <div class="text-[11px] text-zinc-400 mb-4">Możesz czekać na telefon i trenować na własną rękę — ale każdy rok bez ścigania zjada twój OVR.
   ${idle>=2?'<b class="text-red-500 blink">Po trzecim roku bez klubu kariera kończy się sama.</b>':''}</div>
   ${mechanicBox('brak')}
   <div class="flex gap-2 flex-wrap">
     <button onclick="skipYear()" class="btn px-5 py-2.5 font-bold tracking-widest text-orange-500">PRZECZEKAJ ROK ${G.year} &gt;</button>
     <button onclick="mechanicPath()" class="btn px-5 py-2.5 font-bold tracking-widest" style="color:#eab308">PIERDOLĘ, IDĘ ROBIĆ ZA MECHANIKA</button>
     <button onclick="retire('Nikt już nie dzwonił.')" class="btn-d px-5 py-2.5 font-bold tracking-widest text-red-400">ZAKOŃCZ KARIERĘ</button>
   </div></div></div>`;
 }
 /* ============================================================
    ŚCIEŻKA MECHANIKA PRZY SAMYCH OFERTAMI Z KLŻ
    „Pierdolę, idę robić za mechanika" pokazywało się WYŁĄCZNIE przy zerowej
    liczbie ofert. Tymczasem najniższa liga bywa gorsza niż etat w warsztacie —
    jeżeli wszystkie oferty są z KLŻ, gracz musi mieć ten wybór na ekranie.
    ============================================================ */
 const onlyKL = offers.every(o=>o.lk==='KL');
 return head()+`<div class="fade">
 ${playerStrip()}
 ${longInjuryWarnHtml()}
 ${forcedExitHtml()}
 ${marketBox()}
 ${noRenewBox()}
 <div class="brut"><div class="brut-h px-3 py-1.5 text-[11px] text-orange-500 font-bold">OKIENKO TRANSFEROWE // OFERTY NA SEZON ${G.year}</div>
 <div class="p-3 grid md:grid-cols-2 gap-2">
 ${offers.map((o,i)=>`<div class="brut p-3 ${o.stay?'border-orange-800':''}">
   <div class="flex justify-between items-start gap-2">
     <div><div class="font-bold text-zinc-100 text-[12px]">${esc(o.club)}</div>
     <div class="text-[11px] text-zinc-400 tracking-widest">${G.leagues[o.lk].short} · OVR ${o.ovr} · budżet ${zl(o.budget)}</div></div>
     ${o.stay?'<span class="text-[11px] text-orange-500 border border-orange-800 px-1.5 py-0.5">PRZEDŁUŻENIE</span>':''}
   </div>
   ${o.titles>=2?`<div class="mt-2 text-[11px] border px-2 py-1" style="border-color:#a16207;color:#eab308">
     SŁUP OGŁOSZENIOWY: ${o.titles} sponsorów tytularnych w nazwie (${o.sponsors.map(esc).join(', ')})
     — bazowy OVR klubu obniżony o ${Math.abs(o.titlePen)} pkt. Szatnia wie, że to desperacja zarządu.</div>`
    :o.titles===1?`<div class="mt-1 text-[11px] text-zinc-400">sponsor tytularny: ${esc(o.sponsors[0])}</div>`:''}
   <div class="mt-2 border border-zinc-700 bg-[rgba(249,115,22,.07)] px-2 py-1.5">
     <span class="text-[11px] text-zinc-300 tracking-widest">DŁUGOŚĆ UMOWY</span>
     <span class="text-[13px] font-extrabold text-orange-400 ml-2">${o.years} ${lataTxt(o.years)}</span>
     <span class="text-[11px] text-zinc-400 ml-1">(do końca sezonu ${G.year+o.years-1}${o.years>1?' — przez ten czas nie ma okienka transferowego':''})</span>
   </div>
   <div class="mt-2 grid grid-cols-3 gap-2 text-[11px]">

function firstOffers(){
 const p=G.p, out=[], used=new Set();
 const MV=marketValue(p, 1.40);
 G.market={rating:MV.rating, parts:MV.parts, maxOffers:3,
   maxWhy:[{d:3, w:'pierwszy kontrakt w karierze — trzy różne ścieżki do wyboru'}],
   lastAvg:null, interested:3, checked:allClubs().length, floor:null,
   age:p.age, prof:p.prof, med:p.med, ovr:p.ovr, first:true};
 // Trzy różne ścieżki: prestiż (będziesz grzał ławkę), środek, albo klub,
 // w którym od razu wskoczysz do składu. Wybór należy do ciebie.
 const targets=[p.ovr+32+R(-4,4), p.ovr+17+R(-4,4), p.ovr+5+R(-4,4)];
 targets.forEach(t=>{
   const target=cl(t,30,97);
   const pool=[];
   LKEYS.forEach(lk=>G.leagues[lk].clubs.forEach(c=>{
     if(used.has(c.name)) return;
     pool.push({c,lk,diff:Math.abs(c.ovr-target)});
   }));
   pool.sort((a,b)=>a.diff-b.diff);
   const best=pool[0]; if(!best) return;
   used.add(best.c.name);
   const I=clubInterest(p, best.c, best.lk, MV.rating);
   out.push({club:best.c.name, lk:best.lk, ovr:best.c.ovr, budget:best.c.budget, debt:best.c.debt, arr:best.c.arr||0,
     type:'Amatorski', years:R(1,2), rate:R(150,400), bonus:0, stay:false,
     ride:appearanceChance(p,best.c,55,null),
     rating:MV.rating, ratingParts:MV.parts, want:I.want, wantParts:I.parts,
     gap:Math.round(I.gap), press:I.press, rateParts:null, lastAvg:null,
     titles:titleCount(best.c), sponsors:clubTitles(best.c).map(s=>s.n),
     titlePen:sponsorPen(titleCount(best.c))});
 });
 return out.sort((a,b)=>b.ovr-a.ovr);
}

/* ============================================================
   „PIERDOLĘ, IDĘ ROBIĆ ZA MECHANIKA"
   Rok poza torem, ale nie na kanapie: przewijamy sezon (liga żyje dalej),
   zerujemy lojalność i rzucamy kością 5/95.
   ============================================================ */
function mechanicPath(){
 const p=G.p, y=G.year;
 // świat leci dalej: budżety, gospodarka klubów, starzenie się kadr
 allClubs().forEach(clubSeasonBudget);
 clubEconomy();
 ageRiders();
 applyPendingSponsors();                  // nowe szyldy sponsorskie wchodzą i tak
 // etat mechanika: jakaś pensja jest, koszty życia też
 const wage=R(38000,62000), live=livingCostOf(p,true);
 p.budget += wage-live;
 p.loyalty=0;
 p.idleLog=p.idleLog||[];
 /* Rok poza torem to też rok rehabilitacji — długa kontuzja tyka dalej. */
 if((p.longInjury||0)>0){ p.longInjury--; if(!p.longInjury) p.longInjuryWhy=''; }
 const alim = chargeAlimony(p);
 const M={year:y, wage, live, good:false, head:'', rows:[], alimony:alim};
 if(chance(5)){
   /* 5% — TRAFIŁEŚ DO WŁAŚCIWEGO WARSZTATU */
   const o0=p.ovr, e0=p.equip, m0=p.med, f0=p.prof;
   p.ovr   = cl(p.ovr+10,1,99);
   p.equip = 99;
   p.med   = 0;
   p.prof  = cl(p.prof+6,0,99);
   p.keepEquip = true;                    // ten sprzęt zabierasz ze sobą do nowego klubu
   p.mechPath  = 'nicki';
   M.good=true;
   M.head='ZROZUMIAŁEŚ ŻUŻEL U NICKIEGO';
   M.lead='Rok przy stole warsztatowym u człowieka, który silnik składa jak zegarek. Pierwsze trzy miesiące '+
          'podawałeś klucze. Potem zacząłeś rozumieć, dlaczego to wszystko jedzie — albo nie jedzie.';
   M.rows=[['OVR (umiejętności)', o0+' → '+p.ovr, '+10', true],
           ['SPRZĘT', e0+' → '+p.equip, '+'+(p.equip-e0)+' — i ten sprzęt zabierasz ze sobą', true],
           ['PROFESJONALIZM', f0+' → '+p.prof, '+'+(p.prof-f0), true],
           ['MEDIALNOŚĆ', m0+' → '+p.med, 'przez rok nikt o tobie nie napisał ani słowa', false]];
 } else {
   /* 95% — MYŁEŚ PANCERZE */
   const o0=p.ovr, e0=p.equip, f0=p.prof;
   p.ovr   = cl(p.ovr-4,1,99);
   p.prof  = cl(p.prof-10,0,99);
   p.equip = cl(p.equip-6,1,99);
   p.next.forceClub = 'weak';             // zostaje ci najniższa liga
   p.mechPath = 'pancerze';
   M.good=false;
   M.head='MYŁEŚ PANCERZE W KLŻ';
   M.lead='Myjka, opony, plandeka, powrót do domu o czwartej rano. Kierownik drużyny nie zapamiętał '+
          'twojego nazwiska, choć wołał cię co weekend.';
   M.rows=[['OVR (umiejętności)', o0+' → '+p.ovr, '-'+(o0-p.ovr)+' — rok bez motocykla', false],
           ['PROFESJONALIZM', f0+' → '+p.prof, '-'+(f0-p.prof), false],
           ['SPRZĘT', e0+' → '+p.equip, '-'+(e0-p.equip)+' — rdzewiał w garażu', false],
           ['KONTRAKT NA PRZYSZŁY ROK', 'KLŻ', 'zostaje ci wyłącznie najniższa liga', false]];
 }
 p.idleLog.unshift(y+': '+M.head+'. Zarobek na etacie: '+zl(wage)+', koszty życia: '+zl(live)+'.');
 if(p.idleLog.length>4) p.idleLog.pop();
 p.idleYears=(p.idleYears||0)+1;
 p.age++; G.year++;
 syncMeRider();
 if(p.banSeasons>0) p.banSeasons--;
 /* Wyrok o końcu kariery ZAPADA TERAZ, ale gracz najpierw musi zobaczyć,
    co wyszło z roku w warsztacie. Dlatego trzymamy powód i pokazujemy go
    na ekranie wyniku razem z przyciskiem OK. */
 M.retire = retireCheck(p) ||
   (p.idleYears>=3 ? 'Trzy lata poza torem. Zostałeś w parku maszyn na stałe — po drugiej stronie plandeki.' : null);
 G.mech=M; G.screen='mech'; render();
}

/* Zawodnik-Gracz istnieje w G.riders jako zwykły rider i to jego dane widzi
   trener układający skład. Wiek rośnie w nextYear(), a ageRiders() celowo omija
   Gracza — bez tej synchronizacji podgląd składu pokazywałby 22-latka wciąż
   na numerze młodzieżowym, mimo że silnik w meczu już by go tam nie wpuścił. */
function syncMeRider(){
 const p=G.p, r=G.riders.find(x=>x.me);
 if(!r) return null;
 r.age=p.age; r.name=p.name; r.ovr=p.ovr;
 if(p.club){ r.club=p.club; dedupeSquadOvr(p.club); }   // OVR gracza mógł zająć liczbę kolegi z kadry
 return r;
}

   return `<tr class="${r.me?'rowhl':''} border-b border-zinc-700/60">
   <td class="${n?'text-orange-400 font-bold':'text-zinc-400'} w-8">${n||'—'}</td>
   <td class="${r.me?'text-orange-400 font-bold':'text-zinc-200'} truncate max-w-[190px]">${esc(r.name)}${r.me?' (TY)':''}</td>
   <td class="text-center text-zinc-300">${r.age}</td>
   <td class="${catCol(r)} text-[11px]">${catOf(r)}</td>
   <td class="text-center ${r.ovr>=riderLevel(club)?'text-emerald-400':'text-zinc-300'}">${r.ovr}</td>
   <td class="text-center text-[11px] ${fm>0.5?'text-emerald-400':fm<-0.5?'text-red-400':'text-zinc-400'}">${fm>0?'+':''}${fm}</td>
   <td class="text-center font-bold ${n?'text-orange-400':'text-zinc-300'}">${val}</td>
   <td class="text-[11px] ${n?'text-zinc-300':'text-zinc-400'}">${st}</td></tr>`;}).join('')}</tbody></table>
 ${accLite('JAK DZIAŁA USTAWIANIE SKŁADU I NUMERY STARTOWE', `
  <div class="text-[11px] text-zinc-400 tracking-wide leading-relaxed">
  <b class="text-zinc-300">O numerze NIE decyduje sam OVR.</b> Trener patrzy na WARTOŚĆ = OVR + forma × ${LINEUP_FORM_W}
  (forma chodzi od −12 do +12, więc potrafi przestawić zawodnika o ok. 20 punktów). Dlatego czwarty OVR w drużynie
  po dwóch słabych meczach ląduje poza składem, a rozkręcony rezerwowy wskakuje na jego miejsce.<br>
  Pozycje 6 i 7: wyłącznie zawodnicy młodzieżowi U21 — senior nie zajmie tych miejsc, choćby miał najwyższy OVR w lidze.
  W pierwszej piątce musi jechać zawodnik U24: jeśli nie ma w niej nikogo do 24 lat, najsłabszy z niej wylatuje,

  <b class="text-zinc-300">NUMERY STARTOWE:</b> kolumna POZ. to pozycja w składzie (1–5 = pierwsza piątka, 6–7 = młodzież).

function warnings(){
 const p=G.p, c=getClub(p), w=[];
 const th=refusalThreshold(p.age), ch=refusalChance(p.age,c.debt);
 const thTxt = p.age<18 ? 'Masz '+p.age+' lat — do '+zl(th)+' w ogóle się tym nie przejmujesz.'
                        : 'Masz '+p.age+' lat — senior nie jeździ za darmo, próg to zaledwie '+zl(th)+'.';
 if(ch>0) w.push(['ZALEGŁOŚCI KLUBU: '+zl(c.debt)+' — RYZYKO ODMOWY JAZDY '+ch+'% NA KOLEJKĘ',
   thTxt+' Każde kolejne '+zl(refusalStep(p.age))+' długu to +10 p.p. szansy, że nie wyjedziesz na tor. Spłata długu w trakcie sezonu wraca cię do składu.']);
 else if(c.debt>0) w.push(['Klub zalega ci '+zl(c.debt),'Jeszcze jedziesz. '+thTxt]);
 const trb=clubTrouble(c);
 if((c.arr||0)>50000 || trb>=4) w.push(['KLUB ZALEGA CAŁEJ KADRZE: '+zl(c.arr||0)+' — DRUŻYNA TRACI '+trb.toFixed(0)+' PKT OVR NA ZAWODNIKA',
   'Mechanicy nie przyjeżdżają, silniki zostają u tunera, szatnia rozmawia o pieniądzach zamiast o ustawieniach. '+
   'Do czterech zawodników może odmówić jazdy, a rezerwy taktycznej taki klub nie zrobi wcale — nie ma zapasowego silnika. '+
   'W tabeli to widać: klub z zaległościami przegrywa mecze, które na papierze wygrywał.']);
 if(p.contract.type==='Zawodowy'&&p.equip<25) w.push(['SPRZĘT NA POZIOMIE '+p.equip+'/99','Silniki są zajeżdżone. Bez wizyty u tunera będziesz zbierał defekty.']);
 if(p.contract.type==='Zawodowy'&&p.mech<30) w.push(['MECHANIK JAKOŚCI '+p.mech,'Nawet dobry silnik zepsuje ci się w boksie. Zatrudnij kogoś trzeźwego.']);
 if(p.prof<25) w.push(['PROFESJONALIZM '+p.prof,'Będziesz zbierał taśmy i wykluczenia jak Rempała w młodości.']);
 if(p.alimony>0) w.push(['ALIMENTY DO ARGENTYNY: '+zl(ECON.alimony)+' PO KAŻDYM SEZONIE (POZOSTAŁO RAT: '+p.alimony+')',
   'Kwota jest sztywna i schodzi z budżetu niezależnie od wyników, kontuzji i tego, czy klub ci zapłacił. '+
   'Do końca zobowiązania zostawisz w Argentynie '+zl(ECON.alimony*p.alimony)+'.']);
 if(titleCount(c)>=2) w.push(['KLUB MA '+titleCount(c)+' SPONSORÓW TYTULARNYCH W NAZWIE — '+Math.abs(sponsorPen(titleCount(c)))+' PKT OVR',
   'Kevlar wygląda jak tablica ogłoszeń, a szatnia wie, że to nie potęga, tylko desperacja zarządu. '+
   'Zawodnicy z profesjonalizmem powyżej '+SPON.profBlock+' nie podpisują z takimi klubami — jeśli podniesiesz swój, '+
   'ten klub przestanie być dla ciebie opcją.']);
 if(!w.length) return '';
 return `<div class="brut border-red-900 mb-3"><div class="brut-h px-3 py-1.5 text-[11px] text-red-500 font-bold" style="border-color:#7f1d1d">OSTRZEŻENIA PRZED SEZONEM</div>
 <div class="p-3 space-y-1.5">${w.map(x=>`<div><div class="text-[11px] text-red-400 font-bold">${esc(x[0])}</div><div class="text-[11px] text-zinc-300">${esc(x[1])}</div></div>`).join('')}</div></div>`;
}

function buyTuner(i){const t=TUNERS[i],p=G.p;
 if(p.budget<t.c || p.prof<(t.prof||0)) return;
 p.budget-=t.c; p.shop.spent+=t.c; p.shop.bought.push(i);
 if(t.risk&&chance(t.risk)){const g=Math.max(0,Math.round(t.e*0.2)-4);p.equip=cl(p.equip+g,1,99);p.shop.equipGain+=g;
   p.shop.log.push(t.n+' — BUBEL, sprzęt ledwo drgnął ('+(g>=0?'+':'')+g+')');}
 else {p.equip=cl(p.equip+t.e,1,99);p.shop.equipGain+=t.e;p.shop.log.push(t.n+' (+'+t.e+' Sprzęt)');}
 render();}
/* Ile odzyskasz, oddając obecnego mechanika (odstępne od nowego pracodawcy). */
function mechBuyout(){ return Math.round((G.p.mechCost||0)*ECON.mechBuyout); }
/* Szacunkowy rachunek za serwis posezonowy — żeby gracz widział, co go czeka. */
function servicePreview(){
 const p=G.p, h=G.history.length?G.history[G.history.length-1]:null;
 const run=h?(h.heats+((h.po&&h.po.h)||0)):55;
 return Math.round(ECON.svcBase + run*ECON.svcPerHeat + p.equip*ECON.svcEquipW);
}
function hireMech(i){const m=MECHS[i],p=G.p;
 /* BLOKADA NADPISANIA: gorszy (albo równy) mechanik to wyrzucanie pieniędzy —
    wcześniej kliknięcie tańszej pozycji podmieniało dobrego fachowca bez ostrzeżenia
    i bez grosza rekompensaty. */
 if(p.mechName===m.n || m.q<=p.mech) return;
 if(p.prof<(m.prof||0)) return;
 const buyout=mechBuyout();
 const net=Math.max(0,m.c-buyout);
 if(p.budget<net) return;
 p.budget-=net; p.shop.spent+=net;
 const old=p.mechName;
 p.mech=m.q; p.mechName=m.n; p.mechCost=m.c;
 p.shop.log=p.shop.log.filter(l=>!l.startsWith('Mechanik: '));
 p.shop.log.push('Mechanik: '+m.n+' (jakość '+m.q+')'+
   (buyout>0?' · odstępne za '+old+': +'+zl(buyout)+', koszt netto '+zl(net):''));
 p.shop.mechHired=true; render();}

/* ============================================================
   WYBÓR OPCJI W ZDARZENIU → PULPIT PODSUMOWANIA → DOPIERO POTEM SEZON
   ------------------------------------------------------------
   Gracze zgłaszali brak feedbacku narracyjnego: klikasz opcję i lądujesz
   od razu w raporcie sezonu, nie wiedząc, co się właściwie stało.
   Teraz opcja może dostarczyć tekst na osobny, mały pulpit:
     · statycznie:  {l:'...', sum:'Tekst na ekran', f:()=>[...]}
     · dynamicznie: f:()=>[fxSum('Tekst zależny od losowania'), fxP(-5)]
   Jeżeli bufor podsumowań (EV_SUM w data.js) jest pusty, zachowujemy stare
   zachowanie i lecimy prosto do rozstrzygnięcia sezonu.
   ============================================================ */
function chooseEv(i){
 const e=G.ev, o=e.o[i];
 G.S.evTitle=e.t; G.S.evChoice=o.l;
 evSumClear();                                    // czyścimy bufor przed odpaleniem efektów
 /* RUBRYKA BUDŻETOWA DECYZJI: gracze pytali, czy zdarzenia z hajsem w opcji
    faktycznie ruszają budżet, czy to tylko tekst. Łapiemy stan konta PRZED
    i PO efekcie i pokazujemy różnicę w pasku gracza (playerStrip), dopóki
    nie zapadnie kolejna decyzja budżetowa. */
 const budgetBefore = G.p.budget;
 /* fxApply() zamienia cokolwiek zwróci zdarzenie na listę czytelnych linijek
    i odpala odroczone efekty z deskryptorów { t, f } — bez tego w rubryce
    EFEKTY lądowało „[object Object]", a sam efekt nigdy się nie wykonywał.
    try/catch, bo pojedyncze zdarzenie nie ma prawa zawiesić całego sezonu. */
 try{ G.S.evLog=fxApply(o.f()); }
 catch(err){ G.S.evLog=['(zdarzenie nie doszło do skutku: '+err.message+')']; }
 const budgetDelta = Math.round(G.p.budget - budgetBefore);
 if(budgetDelta!==0){ G.p.lastDecisionBudgetDelta=budgetDelta; G.p.lastDecisionLabel=e.t; }
 let sum = evSumTake();                           // to, co wrzuciło fxSum() wewnątrz f()
 if(o.sum) sum = [o.sum].concat(sum);             // + statyczny tekst opcji
 if(sum.length){
   G.evSum = sum;
   G.screen='evsum'; render(); return;            // sezon czeka na kliknięcie OK
 }
 finishEv();
}
/* Zamknięcie zdarzenia: dopiero tutaj rozstrzygamy sezon. */

 G.evSum=null;
 resolveSeason();
 G.screen='summary'; render();

/* ============================================================
   CO NAPRAWDĘ ZROBIŁ TWÓJ WYBÓR — KONTROLA WYKONANIA
   Ekran zdarzenia obiecuje karę, walkower, więcej biegów, inną stawkę.
   Ten boks pokazuje, jak te obietnice weszły do rozegranego sezonu
   i co z nich przechodzi na kolejny rok. Nic tu nie jest opisem — to odczyt
   stanu, z którym silnik naprawdę policzył sezon.
   ============================================================ */
function evEffectsHtml(r){
 const E=r.evEffects; if(!E) return '';
 const L=[];
 const ok=(t)=>L.push({t, c:'text-emerald-400'});
 const bad=(t)=>L.push({t, c:'text-red-400'});
 const neu=(t)=>L.push({t, c:'text-zinc-300'});
 if(E.fines)        bad('Kary finansowe pobrane z budżetu: '+zl(E.fines));
 if(E.rateMul!==1)  (E.rateMul>1?ok:bad)('Stawka za punkt w tym sezonie: ×'+E.rateMul.toFixed(2)+' — rozliczona przy każdej kolejce');
 if(E.noEarnings)   bad('Zrzeczenie się wynagrodzenia wykonane: z ligi nie wpłynął ani grosz');
 if(E.heatPP)       (E.heatPP>0?ok:bad)('Wpływ na skład: '+(E.heatPP>0?'+':'')+E.heatPP+' p.p. — doliczone do twojej wartości u trenera przy KAŻDEJ kolejce');
 if(E.ovrBonus)     (E.ovrBonus>0?ok:bad)('Dyspozycja w meczach: '+(E.ovrBonus>0?'+':'')+E.ovrBonus+' OVR — liczone w każdym biegu tego sezonu');
 if(E.teamOvr)      (E.teamOvr>0?ok:bad)('OVR całej drużyny: '+(E.teamOvr>0?'+':'')+E.teamOvr+' — zmieniony na stałe');
 if(E.teamPts)      (E.teamPts>0?ok:bad)('Punkty drużyny w tabeli: '+(E.teamPts>0?'+':'')+E.teamPts);
 if(E.banMatches)   bad('Zawieszenie wykonane: '+E.banMatches+' spotkań poza składem');
 if(E.injuryPP)     (E.injuryPP>0?bad:ok)('Ryzyko urazu: '+(E.injuryPP>0?'+':'')+E.injuryPP+' p.p. (łącznie w tym sezonie '+E.injuryP+'%)');
 if(E.extraDefP)    bad('Ryzyko defektu: +'+Math.round(E.extraDefP*1000)/10+' p.p. na każdy bieg');
 if(E.equipFit!=null && E.equipFit<100) bad('Dopasowanie sprzętu: '+E.equipFit+'% — mniej mocy w każdym biegu');
 if(E.walkover)     bad('WALKOWER wykonany w '+E.walkover.round+'. kolejce ('+
   ({lose:'0:75 dla rywala',win:'75:0 dla was',both:'obustronny 0:0',void:'wynik anulowany'}[E.walkover.mode]||'0:75')+
   ')'+(E.walkover.pen?' + kara '+E.walkover.pen+' pkt w tabeli':'')+' — spotkanie NIE zostało rozegrane');
 if(E.zeroMatches)  bad('Kara prezesa wykonana: zero meczów w tym sezonie');
 if(E.forcedEnd)    bad('Sezon urwany decyzją pozaboiskową — play-off, DMPJ i turnieje odpadły');
 if(E.noRenew)      bad('Klub zerwał rozmowy o kontrakcie — po sezonie wychodzisz na rynek');
 const N=E.next||{}, NX=[];
 if(N.zeroMatches)  NX.push('kolejny sezon: 0 meczów');
 if(N.heatPP)       NX.push('szanse na skład '+(N.heatPP>0?'+':'')+N.heatPP+' p.p.');
 if(N.injuryPP)     NX.push('ryzyko urazu '+(N.injuryPP>0?'+':'')+N.injuryPP+' p.p.');
 if(N.rateMul&&N.rateMul!==1) NX.push('stawka ×'+N.rateMul.toFixed(2));
 if(N.betterOffers) NX.push('lepsze oferty w najbliższym okienku (+5 do wartości rynkowej, +1 oferta)');
 if(N.forceClub)    NX.push('wymuszona zmiana klubu w okienku');
 if(N.lockTransfer) NX.push('blokada transferowa na '+N.lockTransfer+' okienko/okienka');
 if(N.noSponsor)    NX.push('zero premii za podpis w najbliższym okienku');
 if(N.rowPen)       NX.push('mniejsza szansa na ofertę z Rybnika');
 if(N.longInjury)   NX.push('kolejny sezon poza torem (kontuzja długoterminowa)');
 if(N.alimony)      NX.push('alimenty: pozostało rat '+N.alimony);
 if(!L.length && !NX.length) return accLite('KONTROLA WYKONANIA',
   `<div class="text-[11px] text-zinc-400">Ten wybór nie miał skutków mechanicznych — poza tym, co przeczytałeś wyżej.</div>`);
 const body = `<ul class="text-[11px] space-y-0.5">${L.map(x=>`<li class="${x.c}">✓ ${esc(x.t)}</li>`).join('')}</ul>
  ${NX.length?`<div class="text-[11px] mt-1" style="color:#38bdf8">PRZECHODZI NA KOLEJNY ROK: ${esc(NX.join(' · '))}</div>`:''}`;
 return accLite('KONTROLA WYKONANIA — CO SILNIK REALNIE POLICZYŁ', body,
   {badge:L.length+(NX.length?' + '+NX.length+' na przyszłość':'')});
}

/* ---- PRZEJŚCIE DO KOLEJNEGO ROKU ---- */
function nextYear(){
 const p=G.p;
 /* KARIERA URWANA PRZEZ ZDARZENIE (fxEnd: wiatrówka, katastrofa awionetki,
    uraz kręgosłupa na crossie, gigantyczny przypał). Wcześniej fxEnd ustawiał
    p.retired=true i NIKT tego nie sprawdzał — gracz spokojnie jechał dalej. */
 if(p.retired){ retire(p.retireReason||'Zdarzenie zamknęło karierę.'); return; }
 if(G.nextIMP){G.recIMP=G.nextIMP;G.nextIMP=null;}
 if(G.nextMimpChamp){G.recMIMP=G.nextMimpChamp;G.nextMimpChamp=null;}
 ageRiders();
 /* NOWE SZYLDY SPONSORÓW TYTULARNYCH wchodzą w życie z nowym rokiem —
    dopiero teraz klub realnie zmienia nazwę (kadra, Gracz, tabele). */
 applyPendingSponsors();
 p.age++; G.year++;
 syncMeRider();                       // Gracz też się starzeje — także w oczach trenera
 if(p.banSeasons>0) p.banSeasons--;
 p.contract.years--;
 // rozwój klubów
 LKEYS.forEach(k=>G.leagues[k].clubs.forEach(c=>{c.mood=R(20,90);}));
 /* KONIEC KARIERY LICZONY, NIE SZTYWNY: granicę wyznaczają profesjonalizm i OVR
    (retireAgeOf/retireCheck w engine.js), a nie stałe „40 lat". */
 const why=retireCheck(p);
 if(why){ retire(why); return; }
 /* ============================================================
    PRZERWA ZIMOWA — OSOBNA PULA ZDARZEŃ (WINTER_EVENTS)
    Odpalana MIĘDZY resolveSeason() a makeOffers(): skutki decyzji
    zimowych (OVR, sprzęt, kasa, alimenty, wymuszony transfer, lepsze
    oferty) są widoczne już w okienku transferowym.
    ============================================================ */
 G.wev=null; G.wevLog=[]; G.wevDone=false; G.wevTitle=null; G.wevChoice=null; G.wevSum=[];
 if(chance(WINTER_CHANCE)){
   const e=rollWinterEvent();
   if(e){ G.wev=e; G.screen='winter'; render(); return; }
 }
 afterWinter();
}
/* Routing PO przerwie zimowej: okienko transferowe / przedłużenie / hub. */
function afterWinter(){
 const p=G.p;
 /* KARIERA URWANA PRZEZ ZDARZENIE ZIMOWE (fxEnd: wiatrówka, lód pod motocyklem,
    petarda, próba przekupienia straży granicznej). nextYear() sprawdza p.retired
    tylko na WEJŚCIU, czyli PRZED przerwą zimową — bez tej linijki gracz
    „po zakończonej karierze" spokojnie podpisywał kontrakt i jechał kolejny sezon,
    a koniec kariery wchodził dopiero rok później. */
 if(p.retired){ retire(p.retireReason||'Zdarzenie zimowe zamknęło karierę.'); return; }
 /* ============================================================
    TRYBUNAŁ PZM — OSOBNE, NIEZALEŻNE ZDARZENIE ZIMOWE
    Ustawiane przez resolveSeason() (engine.js), gdy w sezonie był bunt
    płacowy przy wieloletnim kontrakcie, a klub wciąż zalega. Pokazuje się
    ZAWSZE, niezależnie od tego, czy zwykłe losowanie zimowe (WINTER_EVENTS)
    coś wylosowało — więc w jednej przerwie mogą wypaść dwa ekrany zdarzeń.
    ============================================================ */
 if(p.next.tribunalCase){ G.screen='tribunal'; render(); return; }
 afterWinterCore();
}
/* Dawna treść afterWinter() — teraz wołana PO ewentualnym trybunale. */
function afterWinterCore(){
 const p=G.p;
 const noRenew = G.S ? G.S.noRenew : false;
 /* ============================================================
    WYMUSZONY TRANSFER MUSI OTWORZYĆ OKIENKO
    Zdarzenia ustawiają p.next.forceClub (świstek, niezapięty kask juniora,
    wejście na lewo dla dziadka, Słowacja, wypłata w diamentach, kuszenie
    przez rywala, rok mycia pancerzy). Konsumuje tę flagę WYŁĄCZNIE
    makeOffers() — a ten był wołany tylko wtedy, gdy umowa wygasła. Przy
    kontrakcie na 2-3 lata skutek zdarzenia po prostu przepadał.
    Teraz wymuszony transfer zrywa umowę i otwiera rynek.
    ============================================================ */
 if(p.next.forceClub && p.contract.years>0){
   p.contract.years=0;
   p.forcedExit=true;
 }
 if(p.contract.years<=0 || noRenew || p.next.forceClub){
   if(noRenew) p.next.noRenew=true;
   _offers=[]; G.screen='sign'; render(); return;
 }
 /* PRZEDŁUŻENIE W TRAKCIE UMOWY — droga do kariery w jednym klubie */
 _renew = makeRenewOffer();
 if(_renew){ G.screen='renew'; render(); return; }
 G.screen='hub'; render();
}

/* ---- EKRAN: TRYBUNAŁ PZM ---- */
function resolveTribunal(reported){
 const p=G.p, tc=p.next.tribunalCase;
 let log=[];
 if(reported){
   if(chance(75)){
     const c=clubOf(p);
     let recovered=0;
     if(c && c.debt>0){
       recovered=Math.round(c.debt*RF(0.50,0.85));
       c.debt=Math.max(0,c.debt-recovered);
       p.budget+=recovered; p.career.earned+=recovered;
     }
     p.contract.years=0; p.forcedExit=true; p.next.noRenew=true;
     log=['TRYBUNAŁ PZM ROZWIĄZUJE KONTRAKT.',
          'Umowa z '+tc.club+' przestaje obowiązywać ze skutkiem natychmiastowym.',
          recovered? ('Klub musi rozliczyć zaległości: odzyskujesz '+zl(recovered)+' z '+zl(tc.debt)+'.')
                   : 'Z zaległości nie udaje się odzyskać ani grosza — klub formalnie nie ma z czego oddać.',
          'Wchodzisz na wolny rynek już teraz, przed zwykłym okienkiem transferowym.'];
   } else {
     const c=clubOf(p);
     if(c) c.debt=0;
     log=['PREZES PRZEKUPIŁ ZWIĄZEK.',
          'Trybunał oddala sprawę. Kontrakt z '+tc.club+' trwa dalej bez zmian —',
          'ale, o dziwo, cała zaległość ('+zl(tc.debt)+') znika z papierów klubu. Nikt niczego nie tłumaczy.'];
   }
 } else {
   log=['Odpuszczasz sprawę, żeby nie zadzierać z zarządem.',
        'Zaległość ('+zl(tc.debt)+') zostaje tam, gdzie była — kontrakt trwa dalej na dotychczasowych warunkach.'];
 }
 p.next.tribunalCase=null;
 G.tribunalLog=log; G.tribunalDone=true; render();
}
function afterTribunal(){
 G.tribunalDone=false; G.tribunalLog=null;
 afterWinterCore();
}

function skipYear(){
 const p=G.p, y=G.year;
 // liga żyje dalej także wtedy, gdy ty siedzisz w domu
 allClubs().forEach(clubSeasonBudget);
 clubEconomy();
 ageRiders();
 applyPendingSponsors();
 /* Rok poza torem to też rok rehabilitacji. */
 if((p.longInjury||0)>0){ p.longInjury--; if(!p.longInjury) p.longInjuryWhy=''; }
 const alim = chargeAlimony(p);
 const loss=R(1,4);
 p.ovr=cl(p.ovr-loss,1,99);
 p.med=cl(p.med-R(5,12),0,99);
 p.equip=cl(p.equip-R(3,8),1,99);
 p.loyalty=0;
 // rok bez klubu też kosztuje — jeść trzeba, rata za busa leci dalej
 const live=livingCostOf(p,true);
 p.budget-=live;
 p.career.living=(p.career.living||0)+live;
 p.idleYears=(p.idleYears||0)+1;
 p.idleLog=p.idleLog||[];
 p.idleLog.unshift(y+': cały rok bez klubu — OVR -'+loss+', medialność w dół, sprzęt rdzewieje w garażu, '+
   'koszty życia '+zl(live)+(alim?', alimenty do Argentyny '+zl(alim.amount)+' (rat: '+alim.left+')':'')+
   (p.banSeasons>0?' (trwa zawieszenie)':''));
 if(p.idleLog.length>4) p.idleLog.pop();
 p.age++; G.year++;
 syncMeRider();
 if(p.banSeasons>0) p.banSeasons--;
 const why=retireCheck(p);
 if(why){retire(why);return;}
 if(p.idleYears>=3){retire('Trzy lata bez klubu. Kariera skończyła się bez ogłoszenia.');return;}
 _offers=[]; G.screen='sign'; render();
}

   ============================================================ */
const SM={g:'#0f8a3d', gd:'#0a6b2f', gl:'#eaf6ee', gl2:'#f6fbf7', bd:'#d5e3d9',
          tx:'#1f2937', mu:'#6b7280', rd:'#c81e1e'};

/* Rozbicie kodów z linii meczowych: miejsca w biegach + biegi nieukończone.
   Silnik notuje "d" (defekt) i "w" (wykluczenie); kolumny U (upadek) i T (taśma)
   zostają w tabeli dla zgodności z układem portalu i czekają na dane.
   LICZYMY RUNDĘ ZASADNICZĄ **I** PLAY-OFF — dokładnie ten sam zakres, z którego
   biorą się kolumny M i B oraz kafelki na górze karty. Wcześniej kody szły
   wyłącznie z ligi, więc suma I+II+III+IV+D+W nie schodziła się z liczbą biegów. */
function smCodes(h){
 const s={I:0,II:0,III:0,IV:0,D:0,U:0,W:0,T:0};
 const one = c => {
   if(c==='-') return;                       // zmieniony przez rezerwę — to nie był start
   if(c==='d'){s.D++;return;}
   if(c==='u'){s.U++;return;}
   if(c==='w'){s.W++;return;}
   if(c==='t'){s.T++;return;}
   const v=parseInt(c,10);
   if(v===3)s.I++; else if(v===2)s.II++; else if(v===1)s.III++; else if(v===0)s.IV++;
 };
 (h.lines||[]).forEach(L=>{ if(!L.rode || !L.codes) return; L.codes.forEach(one); });
 ((h.po && h.po.codes) || []).forEach(one);
 return s;
}
/* Dorobek sezonu w jednym miejscu: liga + play-off. Stare zapisy w G.history
   (sprzed poprawki) nie mają pól *All — dla nich liczymy je z r.po na miejscu,
   żeby wczytana wcześniej kariera też pokazywała spójne liczby. */
const smM   = h => h.matchesAll != null ? h.matchesAll : (h.matches||0) + ((h.po&&h.po.m)||0);
const smB   = h => h.heatsAll   != null ? h.heatsAll   : (h.heats||0)   + ((h.po&&h.po.h)||0);
const smP   = h => h.ptsAll     != null ? h.ptsAll     : (h.pts||0)     + ((h.po&&h.po.p)||0);
const smBon = h => h.bonusAll   != null ? h.bonusAll   : (h.bonus||0)   + ((h.po&&h.po.b)||0);
const smAvg = h => { const b=smB(h); return b>0 ? (smP(h)/b).toFixed(2) : '—'; };
/* Kluby z kariery — kolejne "przystanki", sklejone po sąsiadujących sezonach. */
function smClubs(){
 const out=[];
 G.history.forEach(h=>{
   const last=out[out.length-1];
   if(last && last.club===h.club){
     last.to=h.year; last.seasons++; last.pts+=smP(h); last.matches+=smM(h);
     if(!last.leagues.includes(h.league)) last.leagues.push(h.league);
     last.debt += (h.settle&&h.settle.unpaid)||0;
   } else out.push({club:h.club, leagues:[h.league], from:h.year, to:h.year,
                    seasons:1, pts:smP(h), matches:smM(h),
                    debt:(h.settle&&h.settle.unpaid)||0});
 });
 return out;
}
/* ============================================================
   GABLOTA — OSIĄGNIĘCIA INDYWIDUALNE I TYTUŁY
   Karta kariery pokazywała dotąd wyłącznie ligę, sezon po sezonie. Cały
   dorobek z turniejów (IMP, MIMP, Kaski) i DMPJ istniał w danych, ale nigdzie
   nie schodził się w jedno miejsce — trzeba go było zbierać z zakładek
   poszczególnych sezonów. Tu leci komplet: złoto / srebro / brąz z latami,
   liczba startów i najlepszy wynik dla każdych rozgrywek osobno.
   ============================================================ */
const SM_TROPHY = [
 {k:'imp',  n:'INDYWIDUALNE MISTRZOSTWA POLSKI', s:'IMP',  gold:'Indywidualny Mistrz Polski'},
 {k:'mimp', n:'MŁODZIEŻOWE IND. MISTRZOSTWA POLSKI', s:'MIMP', gold:'Młodzieżowy Ind. Mistrz Polski'},
 {k:'zk',   n:'ZŁOTY KASK',    s:'ZK', gold:'Zwycięzca Złotego Kasku'},
 {k:'sk',   n:'SREBRNY KASK',  s:'SK', gold:'Zwycięzca Srebrnego Kasku'},
 {k:'bk',   n:'BRĄZOWY KASK',  s:'BK', gold:'Zwycięzca Brązowego Kasku'}
];
/* Pozycja drużyny gracza w finale DMPJ (0 = nie było jej w finałowej czwórce). */
function smDmpjPos(h){
 const D=h.dmpj;
 if(!D || !D.eligible) return null;
 const team = D.myTeam || h.club;
 return ((D.classification||[]).indexOf(team) + 1) || 0;
}
function smTrophies(){
 const mk=(n,s)=>({n, s, g:[], si:[], b:[], starts:0, best:0, bestYear:null});
 const rows = SM_TROPHY.map(d=>Object.assign(mk(d.n,d.s), {k:d.k, gold:d.gold}));
 const dmpj = Object.assign(mk('DMPJ — DRUŻYNOWE MP JUNIORÓW','DMPJ'),
                            {gold:'Drużynowy Mistrz Polski Juniorów'});
 /* DMP — DRUŻYNOWE MISTRZOSTWA POLSKI: to miano należy się WYŁĄCZNIE tytułowi
    z Ekstraligi. Wcześniej ten sam napis „Drużynowy Mistrz Polski” i wspólna
    rubryka DMP zbierały też mistrzostwo 2. Ekstraligi i Krajowej Ligi
    Żużlowej — w karcie kariery wyglądało to tak, jakby awans z KLŻ był
    mistrzostwem kraju. Teraz każda klasa rozgrywkowa ma swoją, osobną gablotę. */
 const dmp  = Object.assign(mk('DMP — DRUŻYNOWE MISTRZOSTWA POLSKI (EKSTRALIGA)','DMP'),
                            {gold:'Drużynowy Mistrz Polski'});
 const dmp2 = Object.assign(mk('MISTRZOSTWO 2. EKSTRALIGI','2.EL'),
                            {gold:'Mistrz 2. Ekstraligi'});
 const dmpKl= Object.assign(mk('MISTRZOSTWO KRAJOWEJ LIGI ŻUŻLOWEJ','KLŻ'),
                            {gold:'Mistrz Krajowej Ligi Żużlowej'});
 const note = (r,pos,year)=>{
   if(pos===1) r.g.push(year); else if(pos===2) r.si.push(year); else if(pos===3) r.b.push(year);
   if(pos>0 && (!r.best || pos<r.best)){ r.best=pos; r.bestYear=year; }
 };
 G.history.forEach(h=>{
   const I=h.ind||{};
   rows.forEach(r=>{ const c=I[r.k]; if(!c || !c.rode) return;
     r.starts++; note(r, c.mePos||0, h.year); });
   const dp=smDmpjPos(h);
   if(dp!==null){ dmpj.starts++; note(dmpj, dp, h.year); }
   /* Liga: 1-3 miejsce w play-off to komplet medali DMP danej klasy rozgrywkowej —
      ale liczone do WŁAŚCIWEJ tabeli, wg tego, w której lidze (h.lk) faktycznie grałeś. */
   if(h.matches>0 && h.pos>0){
     const target = h.lk==='EL' ? dmp : h.lk==='E2' ? dmp2 : dmpKl;
     target.starts++; note(target, h.pos<=3?h.pos:0, h.year);
   }
 });
 return [...rows, dmpj, dmp, dmp2, dmpKl];
}
/* "1 klub", "2 kluby", "7 klubów" — portal ma wyglądać poważnie. */
const smKlub = n => n===1 ? 'klub'
  : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20)) ? 'kluby' : 'klubów';
const smUnpaid = h => (h.settle && h.settle.unpaid) || 0;
const smPzm    = h => (h.settle && h.settle.pzmEarned) || 0;

 /* Kafelek z krążkiem — puste miejsce zostaje szare, żeby gablota nie kłamała. */
 const disc=(cnt,col,lab)=>`<td style="border:1px solid ${SM.bd};background:${cnt?'#fffdf5':'#fafafa'};

 /* Lata na podium z widoczną etykietą krążka — bez niej „2027, 2028  2026"

 const yrs=(arr,col,lab)=>arr.length

/* ============================================================
   ZRZUT KARTY DO PNG — WERSJA ODPORNA NA BŁĘDY
   ------------------------------------------------------------
   DLACZEGO WCZEŚNIEJ NIE POBIERAŁO SIĘ NIC:
   1) #smCardWrap stoi na `position:fixed; left:-14000px`. html2canvas
      klonuje REALNY dokument i liczy pozycje z getBoundingClientRect()
      — element 14 000 px poza ekranem daje pusty (albo obcięty) obrazek.
      Poprawianie tego w `onclone` jest zawodne: rozmiary bierze się
      z ORYGINAŁU (offsetWidth/Height) jeszcze przed klonowaniem, a przy
      `position:fixed` w klonie i tak zostaje przesunięty kontekst.
   2) `el.offsetHeight` na elemencie z ujemnym z-index i długą tabelą
      potrafi zwrócić mniej niż realna wysokość treści (scrollHeight).
   3) `scale:2` przy karcie 1240 px i kilkunastu sezonach przekraczało
      limit powierzchni canvasa w Safari/iOS — toDataURL zwracał wtedy
      pusty ciąg albo rzucał wyjątkiem, a stary kod ustawiał go jako href
      i „pobierał" plik 0-bajtowy.
   4) Brakowało obsługi błędu: `.catch(e=>alert(...))` pokazywał surowy
      obiekt, a przycisk zostawał zablokowany, gdy coś poszło nie tak
      przed wejściem w Promise.

   CO ROBI TERAZ:
   · na czas zrzutu wyciąga kontener na `position:absolute; left:0; top:0`
     (i zawsze go odkłada z powrotem — również przy wyjątku),
   · czeka na layout (2 × requestAnimationFrame) i na fonty,
   · liczy realną szerokość/wysokość i DOBIERA `scale` do limitu canvasa,
   · zapis: toBlob → (fallback) toDataURL → (fallback) otwarcie karty
     w nowym oknie do ręcznego zrzutu,
   · wszystko w try/catch/finally z czytelnym komunikatem po polsku.
   ============================================================ */
const PNG_MAX_PX = 12000;          // bezpieczny limit dłuższej krawędzi canvasa

function careerSlug(){
 return ((G.p&&G.p.name)||'zawodnik').toLowerCase()
   .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l').replace(/ń/g,'n')
   .replace(/ó/g,'o').replace(/ś/g,'s').replace(/[żź]/g,'z')
   .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'zawodnik';
}
/* Zapis canvasa na dysk. Zwraca true, jeśli plik faktycznie poszedł do pobrania. */
function saveCanvasAsPNG(canvas, filename){
 return new Promise(resolve=>{
   const viaUrl=url=>{ try{
       const a=document.createElement('a');
       a.download=filename; a.href=url; a.rel='noopener';
       document.body.appendChild(a); a.click(); a.remove();
       return true;
     }catch(_){ return false; } };
   // 1) najpewniejsza droga: Blob + ObjectURL (nie ma limitu długości URL-a)
   if(typeof canvas.toBlob==='function'){
     let done=false;
     const guard=setTimeout(()=>{ if(!done){ done=true; resolve(fallbackDataUrl()); } }, 8000);
     canvas.toBlob(blob=>{
       if(done) return; done=true; clearTimeout(guard);
       if(!blob || !blob.size){ resolve(fallbackDataUrl()); return; }
       const url=URL.createObjectURL(blob);
       const ok=viaUrl(url);
       setTimeout(()=>URL.revokeObjectURL(url), 30000);
       resolve(ok);
     },'image/png');
     return;
   }
   resolve(fallbackDataUrl());
   // 2) awaryjnie: data URL
   function fallbackDataUrl(){
     let data='';
     try{ data=canvas.toDataURL('image/png'); }catch(_){ return false; }
     if(!data || data.length<2000) return false;         // pusty/uszkodzony zrzut
     return viaUrl(data);
   }
 });
}
/* Ostatnia linia obrony: pokazujemy kartę w nowym oknie, żeby dało się
   zrobić zrzut ekranu albo wydrukować do PDF-a. */
function openCareerCardWindow(){
 try{
   const el=document.getElementById('smCard');
   if(!el) return false;
   const w=window.open('','_blank');
   if(!w) return false;
   w.document.write('<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8">'+
     '<title>Karta statystyk — '+esc((G.p&&G.p.name)||'')+'</title>'+
     '<style>body{margin:0;background:#fff}#smCard,#smCard *{font-family:Arial,Helvetica,sans-serif;box-sizing:border-box}'+
     '#smCard table{border-collapse:collapse}#smCard td,#smCard th{padding:0}</style></head><body>'+
     el.outerHTML+'</body></html>');
   w.document.close();
   return true;
 }catch(_){ return false; }
}

function downloadCareerPNG(btn){
 const oldLabel = btn ? btn.innerHTML : null;
 const wrap = document.getElementById('smCardWrap');
 const el   = document.getElementById('smCard');
 const restore = () => { if(btn){ btn.innerHTML=oldLabel; btn.disabled=false; } };

 (async()=>{
  let prevStyle=null;
  try{
   if(!wrap || !el)
     throw new Error('Nie znalazłem karty statystyk w dokumencie (#smCard). Odśwież stronę i spróbuj ponownie.');
   if(typeof html2canvas!=='function')
     throw new Error('Biblioteka html2canvas nie została wczytana — najczęściej blokuje ją brak internetu, '+
                     'wtyczka typu uBlock albo firmowy proxy. Karta nie może zostać wygenerowana.');
   if(btn){ btn.innerHTML='GENERUJĘ KARTĘ...'; btn.disabled=true; }

   /* --- 1) WYCIĄGAMY KONTENER Z OFFSCREENU --- */
   prevStyle = wrap.getAttribute('style');
   wrap.setAttribute('style','position:absolute;left:0;top:0;z-index:-1;opacity:1;'+
                             'pointer-events:none;background:#ffffff');
   /* --- 2) CZEKAMY NA LAYOUT I FONTY --- */
   await new Promise(res=>requestAnimationFrame(()=>requestAnimationFrame(res)));
   if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(_){} }

   /* --- 3) REALNE WYMIARY + BEZPIECZNA SKALA --- */
   const w = Math.max(el.scrollWidth,  el.offsetWidth,  1240);
   const h = Math.max(el.scrollHeight, el.offsetHeight, 400);
   const scale = Math.max(1, Math.min(2, PNG_MAX_PX/Math.max(w,h)));

   let canvas=null;
   try{
     canvas = await html2canvas(el, {
       backgroundColor:'#ffffff', scale, logging:false,
       useCORS:true, allowTaint:false, foreignObjectRendering:false, imageTimeout:4000,
       width:w, height:h, windowWidth:w+40, windowHeight:h+40, scrollX:0, scrollY:0,
       /* w klonie nie ma po co trzymać animacji ani offscreenu */
       onclone:doc=>{ const cw=doc.getElementById('smCardWrap');
         if(cw) cw.setAttribute('style','position:static;left:0;top:0;z-index:0;opacity:1;background:#ffffff');
         doc.querySelectorAll('.blink').forEach(n=>n.classList.remove('blink')); }
     });
   } finally {
     /* kontener wraca poza ekran ZAWSZE — także gdy html2canvas rzuci wyjątkiem */
     if(prevStyle===null) wrap.removeAttribute('style'); else wrap.setAttribute('style',prevStyle);
     prevStyle=null;
   }
   if(!canvas || !canvas.width || !canvas.height)
     throw new Error('html2canvas zwrócił pusty obrazek (0 × 0 px).');

   /* --- 4) ZAPIS --- */
   const ok = await saveCanvasAsPNG(canvas, 'sportowemity-'+careerSlug()+'-kariera.png');
   if(!ok) throw new Error('Przeglądarka nie pozwoliła zapisać pliku PNG (zablokowane pobieranie '+
                           'albo przekroczony limit rozmiaru obrazka: '+canvas.width+' × '+canvas.height+' px).');
  }catch(err){
   if(prevStyle!==null){ wrap.setAttribute('style',prevStyle); }
   const msg=(err&&err.message)?err.message:String(err);
   const opened = openCareerCardWindow();
   alert('NIE UDAŁO SIĘ POBRAĆ KARTY STATYSTYK.\n\n'+msg+'\n\n'+
     (opened ? 'Otworzyłem kartę w nowej karcie przeglądarki — zrób zrzut ekranu albo wydrukuj ją do PDF (Ctrl+P).'
             : 'Spróbuj wyłączyć blokowanie skryptów dla tej strony i kliknąć jeszcze raz.'));
  }finally{
   restore();
  }
 })();
}

 return head()+`<div class="fade">

   ${kpi('ŚR. KARIERY',avg,'text-emerald-400')}
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-4">
   ${kpi('MISTRZOSTWA LIGI',c.titles,'text-yellow-400')}
   ${kpi('TYTUŁY INDYWIDUALNE',c.indTitles||0,'text-yellow-400')}
   ${kpi('MEDALE INDYWIDUALNE',c.medals||0,'text-zinc-100')}
   ${kpi('NAJLEPSZA ŚREDNIA',c.best,'text-emerald-400')}${kpi('ZAROBIONE',zl(c.earned),'text-orange-400')}
  </div>
  ${c.dmpjStarts?`<div class="text-[11px] text-zinc-300 mb-3">DMPJ: ${c.dmpjStarts} turniejów, ${c.dmpjPts||0} punktów${c.dmpjTitles?`, <b class="text-pink-400">${c.dmpjTitles}× drużynowe mistrzostwo Polski juniorów</b>`:''}.</div>`:''}
  ${c.pzmEarned?`<div class="text-[11px] text-zinc-300 mb-3">Startowe i kilometrówka PZM przez całą karierę: <b class="text-emerald-400">${zl(c.pzmEarned)}</b>.</div>`:''}
